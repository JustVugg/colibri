name: desktop launcher

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'colibri/**'
      - 'tests/launcher/**'
      - 'desktop/launcher*'
      - 'desktop/launcher-licenses/**'
      - 'desktop/launcher-hooks/**'
      - 'pyproject.toml'
      - '.github/workflows/launcher.yml'
  push:
    branches: [main, dev]
    paths:
      - 'colibri/**'
      - 'tests/launcher/**'
      - 'desktop/launcher*'
      - 'desktop/launcher-licenses/**'
      - 'desktop/launcher-hooks/**'
      - 'pyproject.toml'
      - '.github/workflows/launcher.yml'

permissions:
  contents: read

jobs:
  launcher:
    name: Launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1
      - name: Install optional launcher and build tools
        run: python -m pip install -e ".[launcher]" "PySide6==6.11.2" "pyinstaller>=6,<7"
      - name: Launcher tests
        run: python -m unittest discover -s tests/launcher -v
      - name: Package native launcher
        run: python -m PyInstaller --noconfirm --distpath desktop/dist --workpath desktop/build desktop/launcher.spec
      - name: Verify packaged Windows startup
        if: runner.os == 'Windows'
        run: python tests/launcher/packaged_smoke.py desktop/dist/ColibriLauncher/ColibriLauncher.exe .
      - name: Archive Windows package
        if: runner.os == 'Windows'
        run: Compress-Archive -Path desktop/dist/ColibriLauncher -DestinationPath desktop/dist/colibri-launcher-Windows.zip
      - name: Archive Linux package with executable permissions
        if: runner.os == 'Linux'
        run: |
          tar -czf desktop/dist/colibri-launcher-Linux.tar.gz -C desktop/dist ColibriLauncher
          mkdir -p desktop/build/archive-check
          tar -xzf desktop/dist/colibri-launcher-Linux.tar.gz -C desktop/build/archive-check
          test -x desktop/build/archive-check/ColibriLauncher/ColibriLauncher
          python tests/launcher/packaged_smoke.py desktop/build/archive-check/ColibriLauncher/ColibriLauncher .
      - uses: actions/upload-artifact@v4
        with:
          name: colibri-launcher-${{ runner.os }}
          path: desktop/dist/colibri-launcher-*
