# CI: run the repo's own dependency-free gate (`make check` = clean + portable
# CPU build + C unit suites + Python stdlib tests) on the three claimed
# platforms. No model downloads, no CUDA, no external deps — by design (#140).
name: check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: make check
        run: make -C c check

  windows:
    # The job that would have caught #68/#137 pre-merge: native MinGW-w64
    # (MSYS2/UCRT64), the exact toolchain the README's Windows port targets.
    name: Windows UCRT64
    runs-on: windows-latest
    # Measured, not guessed: this job now runs 19-21 minutes, so a 20-minute
    # limit decided the result by runner luck. Three consecutive runs on
    # 2026-08-27 took 19m21s (passed), 20m18s and 20m32s (both cancelled at the
    # limit and reported as failures), including one on dev itself. The suite
    # has grown - segment conformance and adapters, the edge runtime, per-engine
    # cache indices - and MinGW is the slowest toolchain we build on.
    timeout-minutes: 35
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: make check
        run: make -C c check

      # The Windows engine as this branch builds it. Small, and it makes an
      # antivirus false-positive report (#527) verifiable on a PR instead of
      # only after a release is tagged and published.
      - uses: actions/upload-artifact@v4
        with:
          name: colibri-windows-exe
          path: c/colibri.exe

  k3-tiny:
    name: Linux (generated tiny K3 vendor oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: c/tools/requirements-kimi-k3-tiny.txt
      - name: Install pinned tiny-fixture dependencies
        run: python -m pip install -r c/tools/requirements-kimi-k3-tiny.txt
      - name: Generate fixture and run vendor oracle
        run: make -C c kimi-k3-tiny-check

  v4-tiny:
    name: Linux (generated tiny V4 target oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: c/tools/requirements-deepseek-v4-tiny.txt
      - name: Install pinned tiny-fixture dependencies
        run: python -m pip install -r c/tools/requirements-deepseek-v4-tiny.txt
      - name: Generate fixture and run target oracle
        run: make -C c deepseek-v4-tiny-check

  glm53-oracle:
    name: Linux (generated GLM-5.3 oracle contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: c/tools/requirements-glm53-tiny.txt
      - name: Install pinned oracle dependencies
        run: python -m pip install -r c/tools/requirements-glm53-tiny.txt
      - name: Generate and validate oracle contract
        run: |
          python c/tools/make_glm53_tiny.py --output /tmp/glm53_tiny
          python c/tools/check_glm53_checkpoint.py --model /tmp/glm53_tiny
      # The dashboard's Brain and Profile tabs read EMAP/HITS/PROF from the
      # engine's stdout. GLM-5.3-Flash emitted none of them and both tabs were
      # blank (Discord, 2026-09-06). This drives the built engine through
      # `coli serve` and the /experts and /profile endpoints on a streaming
      # fixture, the same path the dashboard takes, so a family that stops
      # emitting a line fails here and not on a user's screen.
      - name: Build glm53 and check the dashboard contract
        run: |
          make -C c glm53
          python c/tools/make_glm53_multimodal_tiny.py --output /tmp/glm53_mm
          python c/tools/make_glm53_streaming_pair.py --fixture /tmp/glm53_mm --output /tmp/glm53_stream
          python c/tools/make_edge_tiny_tokenizer.py --vocab-size 281 /tmp/glm53_stream-i4
          cd c && COLI_GLM53_FIXTURE=/tmp/glm53_stream-i4 python -m unittest -v tests.test_glm53_dashboard

  linux-musl:
    name: Linux (Alpine/musl)
    runs-on: ubuntu-latest
    container: alpine:3.20
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: apk add build-base python3
      - name: make check
        run: make -C c check

  macos:
    # clang; libomp for the threaded path (Makefile falls back to
    # single-threaded automatically if it's ever missing).
    name: macOS (colibri + V4 platform gate)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: install libomp
        run: brew install libomp
      - name: make check (V4 execution gated off)
        run: make -C c check
