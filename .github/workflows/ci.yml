name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  engine:
    name: Engine (Linux, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build colibri + inkling
        run: cd c && make colibri inkling
      - name: C test suite
        run: cd c && make test-c

  # Every engine, on every platform a release archive is built for. Before this,
  # CI built colibri + inkling on Linux only and kimi_k3 on nothing -- so the fact
  # that inkling and kimi_k3 did not compile under msys2/UCRT64 at all was invisible
  # for months, and binary releases silently shipped the GLM engine alone (#720).
  # Each engine is built separately so one failure does not mask the others.
  # The container image. Nothing built docker/Dockerfile.slim in CI before, so a
  # rename or a moved file under c/ could break the image and only a user would
  # find out -- the same gap the .mm and fuzz-rans paths had.
  #
  # Only Dockerfile.slim is built here, on purpose. docker/Dockerfile does
  # `git clone` of the upstream repo (that is its point -- README's zero-setup
  # path downloads that one file and needs no checkout), so building it in CI
  # would test upstream/main rather than this PR. Its Dockerfile is linted for
  # syntax instead.
  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the slim image
        run: docker build -t colibri:ci -f docker/Dockerfile.slim .
      - name: The image actually runs
        # Building is not the same as working: a missing COPY only shows up when
        # the entrypoint tries to import what is not there. --version needs no
        # model, so it exercises the launcher end to end without a 372 GB mount.
        run: |
          docker run --rm colibri:ci --version
          docker run --rm colibri:ci --help > /dev/null
      - name: The engine binary is in the image and is executable
        run: docker run --rm --entrypoint /app/colibri colibri:ci --help 2>&1 | head -5 || true
      - name: Lint both Dockerfiles
        # docker/Dockerfile is not built here (see above) but it is still shipped
        # and followed by users, so it gets checked for syntax at least.
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error

  engines-all-platforms:
    name: All engines (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            shell: bash
          - os: macos-latest
            name: macos
            shell: bash
          - os: windows-latest
            name: windows
            # GitHub shells are format strings: 'msys2 {0}', never bare 'msys2'.
            shell: "msys2 {0}"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.os == 'windows-latest'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
      - if: matrix.os == 'macos-latest'
        run: brew install libomp
      - name: Build every engine
        run: |
          cd c
          rc=0
          for t in colibri inkling kimi_k3 olmoe deepseek-v4; do
            echo "::group::$t"
            make $t || { echo "FAILED: $t"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc

      # The Windows backend-DLL loader contract (c/tests/test_backend_loader.py)
      # had no CI anywhere: the `python` job below is Linux-only, where these
      # tests do not apply. They need no GPU and no HIP SDK — the fixtures are
      # stub DLLs this job's MinGW gcc/objdump build on the fly.
      #
      # shell: pwsh overrides the job default so the tests run outside the MSYS2
      # shell; MSYS2 is on PATH only so gcc/objdump/make are reachable for
      # fixture compilation. The tests themselves are separator-agnostic (they
      # normalise both sides before comparing), so neither interpreter choice nor
      # the shape of the temp root can decide the outcome.
      - name: Windows backend-loader contract tests (no GPU)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          # Nothing here may reach a real GPU, runtime or backend.
          COLI_CUDA: ""
          COLI_GPU: ""
          CUDA_DENSE: ""
          COLI_HIP_RUNTIME_DIR: ""
          HIP_PATH: ""
        run: |
          # ucrt64\bin for gcc/objdump AND usr\bin for make: without make, the
          # host-matrix class skips at setUpClass and the run silently loses
          # tests instead of failing.
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          $env:PATH = "$msys\ucrt64\bin;$msys\usr\bin;$env:PATH"
          foreach ($v in 'COLI_CUDA','COLI_GPU','COLI_GPUS','CUDA_DENSE','CUDA_EXPERT_GB',
                         'COLI_HIP_RUNTIME_DIR','HIP_PATH','ROCM_PATH','ROCM_HOME',
                         'HIP_DEVICE_LIB_PATH','HSA_OVERRIDE_GFX_VERSION',
                         'HIP_VISIBLE_DEVICES','CUDA_VISIBLE_DEVICES') {
            Remove-Item "env:$v" -ErrorAction SilentlyContinue
          }
          python -c "import sys, os, tempfile; print('python', sys.executable); print('os.sep', repr(os.sep)); print('tmp', tempfile.gettempdir())"
          gcc --version | Select-Object -First 1
          make --version | Select-Object -First 1
          cd c
          $out = python -m unittest tests.test_backend_loader -v 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { throw "loader contract tests failed" }
          # A missing toolchain shows up as setUpClass skips, not failures, so a
          # green run with a shrunken test count would hide the real problem.
          if ($out -notmatch '(?m)^Ran (\d+) tests') { throw "could not parse the test count" }
          $ran = [int]$Matches[1]
          $skipped = ([regex]::Matches($out, '\.\.\. skipped')).Count
          "ran=$ran skipped=$skipped"
          if ($skipped -gt 0) { throw "$skipped loader test(s) skipped: the Windows toolchain is incomplete" }

  engine-cuda-syntax:
    name: CUDA syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA toolkit (compiler only)
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          # v0.2.19's version table stops at 12.6.2 — 12.6.3 fails the install
          # step with "Version not available" before nvcc is ever reached.
          cuda: "12.6.2"
          method: network
          sub-packages: '["nvcc"]'
      - name: Compile backend_cuda.cu (syntax only, no GPU)
        run: |
          cd c
          # NOT `nvcc ... | head -40`: a pipeline exits with the status of its
          # LAST command, so head's 0 masked every nvcc error and the job could
          # only ever be green. A check that cannot fail is worse than no check —
          # it buys false confidence in the one file nothing else compiles.
          nvcc -O2 -std=c++17 -arch=sm_80 -c backend_cuda.cu -o /dev/null \
            -Xcompiler=-Wall,-Wextra
          echo "CUDA syntax check passed"
      - name: Compile backend_cuda_ink.cu (syntax only, no GPU)
        run: |
          cd c
          # inkling's own CUDA backend (bf16 residents + int4 expert GEMM); same
          # no-pipeline rule as above so a compile error can actually fail the job.
          nvcc -O2 -std=c++17 -arch=sm_80 -c backend_cuda_ink.cu -o /dev/null \
            -Xcompiler=-Wall,-Wextra
          echo "inkling CUDA syntax check passed"

  inkling-oracle:
    name: Inkling oracle (token-exact vs transformers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: c/tools/oracle-requirements.txt
      - name: Install torch (CPU) + transformers
        run: pip install -r c/tools/oracle-requirements.txt
      - name: Build inkling
        run: cd c && make inkling
      - name: Tiny-model fixture + token-exact oracle (f32, bit-exact experts)
        run: |
          cd c
          # Random-init InklingForCausalLM via HF transformers, then the C engine
          # reproduces it token-for-token. bits=0 keeps experts f32 (bit-exact
          # forward); the greedy pass exits non-zero on any mismatch, so this
          # gate fails the moment a shared-code change regresses the engine.
          python3 tools/make_tiny_inkling.py tiny_inkling
          # The oracle at several cache capacities (#784): a capacity-1 cache
          # exercises eviction on every routed expert, which is where a slot
          # bookkeeping bug shows up and a capacity-8 run never would.
          for cap in 1 2 8; do
            SNAP=tiny_inkling ./inkling "$cap" 0 tiny_inkling/ref_inkling.json
          done
      - name: KV prefix reuse is token-identical (serve, two turns)
        run: |
          cd c
          # Reusing a previous turn's attention state must change the timing and
          # nothing else. A wrong reuse length does not crash -- it answers from
          # another conversation's state and still reads plausibly -- so this is
          # the only gate that would catch it. Needs the fixture above, which is
          # why it runs here and not in `make check`.
          INKLING_TINY=tiny_inkling python3 -m unittest -v tests.test_inkling_prefix_serve

  # The efficiency suite against the tiny GLM oracle. These 8 tests existed but
  # had never run anywhere: they looked for c/glm.exe, a name that stopped
  # existing at the glm -> colibri rename, so _engine_present() was False on
  # every platform and all of them skipped. With that fixed they need only the
  # generated fixture, same shape as inkling-oracle above.
  #
  # Only the four that assert STRUCTURE are run, not the throughput floor:
  # a shared runner's tok/s is not reproducible, and a flaky perf gate gets
  # muted within a week. What these catch is real all the same -- the telemetry
  # lines the whole efficiency tooling parses, PROFILE phases going missing or
  # negative (double-counting), a fully-resident model becoming I/O bound, and
  # two identical greedy runs diverging.
  efficiency:
    name: Efficiency suite (tiny oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: c/tools/oracle-requirements.txt
      - name: Install torch (CPU) + transformers
        run: pip install -r c/tools/oracle-requirements.txt
      - name: Build colibri
        run: make -C c colibri
      - name: Generate the glm_tiny fixture
        run: cd c && python3 tools/make_glm_oracle.py
      - name: Token-exact oracle (teacher forcing)
        # The fixture is only trustworthy if the engine reproduces it, so assert
        # that before reading anything else out of a run.
        run: cd c && SNAP=./glm_tiny TF=1 COLI_TEMP=0 ./colibri 64 16 16
      - name: Structural efficiency tests
        # test_cpu_vs_cpu_determinism is NOT in this list. Despite the name its
        # second assertion is a tok/s stability bound (two runs within 25%), and
        # the tiny replay is 15 ms end to end -- it measured 38.8% between two
        # identical runs on a quiet local box, so a shared runner would make it
        # flaky on day one. Its first assertion (hit-rate identical) IS a real
        # determinism check and does hold; splitting the two is worth doing, but
        # not silently from a CI change.
        run: |
          cd c
          python3 -m unittest -v \
            tests.test_inefficiency.TinyEfficiencyTest.test_telemetry_parses \
            tests.test_inefficiency.TinyEfficiencyTest.test_profile_phases_present_and_nonneg \
            tests.test_inefficiency.TinyEfficiencyTest.test_disk_wait_not_dominant

  engine-hip-syntax:
    name: HIP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        # rocm/dev images are large; hosted runners need the headroom freed
        # BEFORE the pull (which is why this is not a container: job).
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Compile backend_cuda.cu + test binary with hipcc (no GPU)
        run: |
          # Tag pinned: `latest` outgrew the runner disk once already. The
          # gcc-side engine link is skipped: containerized gcc/ld cannot link
          # ROCm runtime libs (both 22.04 and 24.04 bases); the hipcc-driver
          # link of the test binary below covers the single-source claim, and
          # the engine link is exercised on real ROCm hardware (GPU_BACKENDS.md).
          docker run --rm -v "$PWD":/src -w /src rocm/dev-ubuntu-24.04:6.2 bash -c '
            apt-get update && apt-get install -y --no-install-recommends make gcc g++ rocwmma-dev binutils &&
            make -C c gpu-compile HIP=1 HIP_ARCH=gfx1100 &&
            # The engine link is skipped here (see above), so assert the property
            # that link needs instead: backend_cuda.o must be position-independent.
            # hipcc emits a non-PIC/PIE object unless told otherwise, while gcc
            # links -pie by default on the distros users build on, so absolute
            # 32-bit relocations here mean `make HIP=1 colibri` dies with
            #   R_X86_64_32 ... can not be used when making a PIE object
            # That is exactly what happened before -fPIE was added to HIPCCFLAGS:
            # this job stayed green over a HIP build that could not link at all,
            # because gpu-compile links the TEST binary with the hipcc driver
            # (PIC-agnostic) and never runs the gcc engine link. One readelf keeps
            # that regression from silently coming back.
            if readelf -r c/backend_cuda.o | grep -qE "R_X86_64_32S?"; then
              echo "backend_cuda.o has absolute 32-bit relocations: the PIE link of colibri will fail (HIPCCFLAGS needs -fPIE or -fPIC)" >&2
              exit 1
            fi'
          echo "HIP syntax check passed"

  windows-cuda-build:
    # The Windows CUDA path has no coverage anywhere: `engine-cuda-syntax` above
    # compiles with nvcc's *GCC* host on Linux, and check.yml's windows job is
    # MinGW/UCRT64 CPU-only by design (#140). But nvcc on Windows requires MSVC
    # as its host compiler — it does not accept MinGW — so `make cuda-dll` runs a
    # toolchain nothing else in CI touches. That gap is not theoretical: every
    # bug in #158 was a *build* failure on this path (MSVC rejects the GCC-style
    # -Xcompiler=-Wall,-Wextra with "D8021 invalid numeric argument '/Wextra'",
    # unresolvable CUDA_HOME/NVCC defaults, POSIX setenv in the kernel test), and
    # #314 was CUDA_HOME with spaces — the layout the CUDA installer ships by
    # default. Both classes are compile-time and need no GPU to catch.
    #
    # Build-only ON PURPOSE: GitHub's hosted runners have no NVIDIA device, so
    # this job proves the Windows+MSVC CUDA build stays buildable, NOT that the
    # kernels or the DLL loader behave on real silicon. That still needs hardware
    # (see #157). Claiming otherwise would be the false confidence the
    # engine-cuda-syntax comment above already warns about.
    name: CUDA build (Windows, MSVC host)
    # windows-2022, NOT windows-latest: the latest image now ships Visual Studio
    # 18 (MSVC 14.5x), and CUDA's crt/host_config.h hard-errors on any host newer
    # than VS 2022 ("Only the versions between 2017 and 2022 (inclusive) are
    # supported"). That is a real constraint for every CUDA user on Windows, not
    # a CI quirk — pinning tracks what the toolkit actually supports. Revisit when
    # a CUDA release accepts VS 18; -allow-unsupported-compiler would only mask it.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: MSVC environment (puts cl.exe on PATH for nvcc -ccbin)
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install CUDA toolkit (compiler only)
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          # Same pin as engine-cuda-syntax: v0.2.19's version table stops at
          # 12.6.2. This installs to the default "C:\Program Files\NVIDIA GPU
          # Computing Toolkit\..." path, so CUDA_HOME is space-bearing here —
          # which is exactly the #314 regression this job would have caught.
          cuda: "12.6.2"
          method: network
          # cudart as well as nvcc: unlike the Linux job (which only needs to
          # *compile* backend_cuda.cu), cuda-dll links it, and on Windows the
          # runtime headers/import lib ship as a separate installer component —
          # with '["nvcc"]' alone this fails at `#include <cuda_runtime.h>`.
          sub-packages: '["nvcc", "cudart"]'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          # inherit: cl.exe (msvc-dev-cmd) and nvcc (cuda-toolkit) are added to
          # the *Windows* PATH by the steps above; without inheriting it the
          # recipe's `command -v` guards fail inside the MSYS2 shell.
          path-type: inherit
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
      - name: make cuda-dll (nvcc + MSVC host)
        shell: msys2 {0}
        run: |
          cd c
          # CUDA_ARCH is pinned: the default is `native`, which asks the driver
          # what card is present — there is none here, so it must be explicit.
          # sm_80 matches engine-cuda-syntax and is supported by the 12.6 pin.
          make cuda-dll CUDA_ARCH=sm_80
          test -f coli_cuda.dll || { echo "cuda-dll reported success but produced no DLL" >&2; exit 1; }
          echo "coli_cuda.dll built (MSVC host)"
      - name: make colibri CUDA_DLL=1 (host links backend_loader, not cudart)
        shell: msys2 {0}
        run: |
          cd c
          make colibri CUDA_DLL=1
          test -f colibri.exe || { echo "colibri CUDA_DLL=1 reported success but produced no exe" >&2; exit 1; }
          echo "colibri.exe built against the DLL loader"

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npx vitest run

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python test suite
        run: cd c && python3 -m unittest discover -s tests -p 'test_*.py'
