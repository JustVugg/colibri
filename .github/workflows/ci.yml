name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  engine:
    name: Engine (Linux, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build colibri + inkling
        run: cd c && make colibri inkling
      - name: C test suite
        run: cd c && make test-c

  # Every engine, on every platform a release archive is built for. Before this,
  # CI built colibri + inkling on Linux only and kimi_k3 on nothing -- so the fact
  # that inkling and kimi_k3 did not compile under msys2/UCRT64 at all was invisible
  # for months, and binary releases silently shipped the GLM engine alone (#720).
  # Each engine is built separately so one failure does not mask the others.
  # The container image. Nothing built docker/Dockerfile.slim in CI before, so a
  # rename or a moved file under c/ could break the image and only a user would
  # find out -- the same gap the .mm and fuzz-rans paths had.
  #
  # Only Dockerfile.slim is built here, on purpose. docker/Dockerfile does
  # `git clone` of the upstream repo (that is its point -- README's zero-setup
  # path downloads that one file and needs no checkout), so building it in CI
  # would test upstream/main rather than this PR. Its Dockerfile is linted for
  # syntax instead.
  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the slim image
        run: docker build -t colibri:ci -f docker/Dockerfile.slim .
      - name: The image actually runs
        # Building is not the same as working: a missing COPY only shows up when
        # the entrypoint tries to import what is not there. --version needs no
        # model, so it exercises the launcher end to end without a 372 GB mount.
        run: |
          docker run --rm colibri:ci --version
          docker run --rm colibri:ci --help > /dev/null
          # The gateway has runtime modules that launcher-only commands do not
          # import. Exercise that boundary so the advertised serve path cannot
          # ship with a missing Python file.
          docker run --rm --entrypoint python3 colibri:ci -c \
            "import openai_server; print('gateway imports')"
      - name: The engine binary is in the image and is executable
        run: docker run --rm --entrypoint /app/colibri colibri:ci --help 2>&1 | head -5 || true
      - name: Lint both Dockerfiles
        # docker/Dockerfile is not built here (see above) but it is still shipped
        # and followed by users, so it gets checked for syntax at least.
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error
  # The C suite under AddressSanitizer + UndefinedBehaviorSanitizer.
  #
  # Before this the only sanitized code in CI was nothing at all: fuzz-rans has
  # always built with ASan+UBSan but was never wired to a job, and it covers
  # rans.h alone. The engine's pointer arithmetic, mmap/pread paths and worker
  # threads had never been run under a sanitizer here.
  #
  # Leak detection is off on purpose -- the engines allocate the tensor index,
  # parsed config and weight slabs once and use them until exit (st.h calls this
  # out: "intentionally leaked ... one-time startup parsing"). Reporting those
  # would bury the findings that matter under noise nobody intends to fix. The
  # flags live in c/Makefile's test-asan target, not here, so the same command
  # reproduces it locally.
  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C suite under ASan + UBSan
        run: make -C c test-asan
      - name: rANS fuzz round-trip (ASan + UBSan)
        # Already sanitized and already asserting byte identity across every
        # compiled decode arm; it just had no job to run in.
        run: make -C c fuzz-rans

  # The Vulkan backend, COMPILED AND RUN. Before this job, `grep -rn "VK=1\|glslc\|vulkan"
  # .github/workflows/` returned nothing: backend_vulkan.c and the four GLSL shaders were
  # never built by any job, so they could be broken on dev and every check would stay green.
  # Three Vulkan PRs were open at the time this landed, all written by people without the
  # hardware and reviewed by reading the diff.
  #
  # Lavapipe (Mesa's software Vulkan) is what makes running it possible without a GPU. It
  # says NOTHING about performance -- it is a CPU rasteriser and will be slower than the
  # ordinary CPU path -- and it does not reproduce driver-specific behaviour, such as the
  # VK_EXT_memory_budget under-reporting on RADV RX 6000 reported in #891. What it does
  # prove is that the shaders compile, the device and queue negotiation works, the expert
  # tier initialises, and the code path executes at all.
  vulkan:
    name: Vulkan (Lavapipe, software)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Vulkan toolchain and a software driver
        run: |
          sudo apt-get update
          # libvulkan-dev: headers + loader. glslc: compiles the .comp shaders to SPIR-V --
          # neither is present on the runner by default, which is half of why VK=1 was
          # never built here. mesa-vulkan-drivers carries Lavapipe (lvp).
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev glslc mesa-vulkan-drivers
      - name: Build with VK=1
        run: |
          cd c
          make colibri VK=1
          # The shaders are a separate failure mode from the C: glslc can reject a .comp
          # while backend_vulkan.c compiles perfectly. Assert all four exist.
          ls -l shaders/qmatmul.spv shaders/qmatmul_gate_up.spv \
                shaders/attention_absorb.spv shaders/rmsnorm.spv
          ldd colibri | grep -q libvulkan || { echo "FAIL: built without linking libvulkan"; exit 1; }
      - name: Initialise the backend against Lavapipe
        run: |
          cd c
          # A config.json is enough to reach coli_vk_init(): it runs before any weight is
          # read, so the run fails afterwards on the missing model and that is expected.
          # What is asserted is the [VK] banner, not a successful load.
          mkdir -p /tmp/vkprobe
          echo '{"model_type":"glm_moe_dsa"}' > /tmp/vkprobe/config.json
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json \
          COLI_NO_OMP_TUNE=1 COLI_VULKAN=1 SNAP=/tmp/vkprobe \
            timeout 120 ./colibri > vk.log 2>&1 || true
          cat vk.log
          # coli_vk_init() returns 0 and the engine exits 2 with "Vulkan backend
          # unavailable" when the loader finds no device or the shaders are missing, so
          # this line is the whole gate.
          grep -q "\[VK\] ready:" vk.log || {
            echo "FAIL: the Vulkan backend did not initialise"; exit 1; }
          grep -q "expert tier active" vk.log || {
            echo "FAIL: Vulkan initialised but the expert tier did not activate"; exit 1; }
          echo "OK: shaders compiled, device negotiated, expert tier active"

  engines-all-platforms:
    name: All engines (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            shell: bash
            v4: "1"
          - os: macos-latest
            name: macos
            shell: bash
            # arm64 macOS joined COLI_V4_SUPPORTED: compat.h carries the
            # platform differences (fadvise/F_RDADVISE, O_DIRECT/F_NOCACHE)
            # and the token-exact tiny oracle below is the acceptance gate.
            v4: "1"

          - os: windows-latest
            name: windows
            # GitHub shells are format strings: 'msys2 {0}', never bare 'msys2'.
            shell: "msys2 {0}"
            v4: "1"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.os == 'windows-latest'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
      - if: matrix.os == 'macos-latest'
        run: brew install libomp
      # Keep the portable sibling list aligned with release packaging. DeepSeek
      # V4 remains conditional because its amalgamated target is unsupported on
      # one platform in this matrix.
      # The hyphenated target is appended rather than folded into the loop
      # because it must not run on macos.
      - name: Build every engine
        run: |
          cd c
          rc=0
          ENGINES="colibri glm53 inkling kimi_k3 olmoe qwen36 qwen38"
          if [ "${{ matrix.v4 }}" = "1" ]; then ENGINES="$ENGINES deepseek-v4"; fi
          for t in $ENGINES; do
            echo "::group::$t"
            make $t || { echo "FAILED: $t"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc
      - if: matrix.os == 'macos-latest'
        name: Build every Metal-capable engine with METAL=1
        # `make <engine>` above builds the CPU path only: everything behind
        # COLI_METAL is invisible to it. That is how #1150 survived a month --
        # inkling.c kept calling coli_metal_moe_block with the pre-qgs
        # signature from v1.6.0 onward and no job ever compiled the call.
        # Compile-only by necessity: the runner's Apple Paravirtual device
        # cannot execute Metal submissions (see the note below), but signature
        # drift is a compile error, which is exactly what this catches.
        run: |
          cd c
          rc=0
          for t in colibri inkling kimi_k3; do
            echo "::group::$t METAL=1"
            make clean >/dev/null 2>&1 || true
            make $t METAL=1 || { echo "FAILED: $t METAL=1"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc
      - if: matrix.os == 'macos-latest'
        name: Metal backend tests
        # The Metal backend suite is its own target (metal-test) and is not
        # part of `make check`: TEST_BINS is derived from tests/test_*.$(EXE)
        # rules, and backend_metal_test is built/run by the metal-test target
        # itself. Nothing in CI exercised it until issue #940 shipped a
        # compile error in it, so run it explicitly on the Apple Silicon
        # runners.
        # The runner's Apple Paravirtual device hangs on Metal submissions
        # (observed: 47 min vs a 5-6 min normal run), so the test harness
        # detects it and skips GPU execution with an explicit line; this
        # timeout is the backstop that turns any residual hang into a red X.
        timeout-minutes: 10
        run: |
          cd c
          make metal-test

      # macOS is the newest COLI_V4_SUPPORTED platform and the only one whose
      # engine coverage lives solely in this job (Linux has the v4-tiny job in
      # check.yml, Windows was first exercised at the release tag). The tiny
      # oracle is the token-exactness gate: it fails on any numerical or I/O
      # divergence, which is exactly what a platform port can break.
      #
      # The check target REGENERATES the fixture (--force) before comparing,
      # so it needs the same pinned torch/transformers the Linux v4-tiny job
      # installs -- without them the step dies in generation, not in the
      # oracle (round 2 of this PR measured exactly that).
      - uses: actions/setup-python@v5
        if: matrix.os == 'macos-latest'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: c/tools/requirements-deepseek-v4-tiny.txt
      - name: Install pinned tiny-fixture dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: python -m pip install -r c/tools/requirements-deepseek-v4-tiny.txt
      - name: DeepSeek V4 tiny oracle (macOS)
        if: matrix.os == 'macos-latest'
        run: make -C c deepseek-v4-tiny-check

      # The Windows backend-DLL loader contract (c/tests/test_backend_loader.py)
      # had no CI anywhere: the `python` job below is Linux-only, where these
      # tests do not apply. They need no GPU and no HIP SDK — the fixtures are
      # stub DLLs this job's MinGW gcc/objdump build on the fly.
      #
      # shell: pwsh overrides the job default so the tests run outside the MSYS2
      # shell; MSYS2 is on PATH only so gcc/objdump/make are reachable for
      # fixture compilation. The tests themselves are separator-agnostic (they
      # normalise both sides before comparing), so neither interpreter choice nor
      # the shape of the temp root can decide the outcome.
      - name: Windows backend-loader contract tests (no GPU)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          # Nothing here may reach a real GPU, runtime or backend.
          COLI_CUDA: ''
          COLI_GPU: ''
          CUDA_DENSE: ''
          COLI_HIP_RUNTIME_DIR: ''
          HIP_PATH: ''
        run: |
          # ucrt64\bin for gcc/objdump AND usr\bin for make: without make, the
          # host-matrix class skips at setUpClass and the run silently loses
          # tests instead of failing.
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          $env:PATH = "$msys\ucrt64\bin;$msys\usr\bin;$env:PATH"
          foreach ($v in 'COLI_CUDA','COLI_GPU','COLI_GPUS','CUDA_DENSE','CUDA_EXPERT_GB',
                         'COLI_HIP_RUNTIME_DIR','HIP_PATH','ROCM_PATH','ROCM_HOME',
                         'HIP_DEVICE_LIB_PATH','HSA_OVERRIDE_GFX_VERSION',
                         'HIP_VISIBLE_DEVICES','CUDA_VISIBLE_DEVICES') {
            Remove-Item "env:$v" -ErrorAction SilentlyContinue
          }
          python -c "import sys, os, tempfile; print('python', sys.executable); print('os.sep', repr(os.sep)); print('tmp', tempfile.gettempdir())"
          gcc --version | Select-Object -First 1
          make --version | Select-Object -First 1
          cd c
          $out = python -m unittest tests.test_backend_loader -v 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { throw "loader contract tests failed" }
          # A missing toolchain shows up as setUpClass skips, not failures, so a
          # green run with a shrunken test count would hide the real problem.
          if ($out -notmatch '(?m)^Ran (\d+) tests') { throw "could not parse the test count" }
          $ran = [int]$Matches[1]
          $skipped = ([regex]::Matches($out, '\.\.\. skipped')).Count
          "ran=$ran skipped=$skipped"
          if ($skipped -gt 0) { throw "$skipped loader test(s) skipped: the Windows toolchain is incomplete" }

  engine-cuda-syntax:
    name: CUDA syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA toolkit (compiler only)
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          # v0.2.19's version table stops at 12.6.2 — 12.6.3 fails the install
          # step with "Version not available" before nvcc is ever reached.
          cuda: '12.6.2'
          method: network
          sub-packages: '["nvcc"]'
      - name: Compile backend_cuda.cu (syntax only, no GPU)
        run: |
          cd c
          # NOT `nvcc ... | head -40`: a pipeline exits with the status of its
          # LAST command, so head's 0 masked every nvcc error and the job could
          # only ever be green. A check that cannot fail is worse than no check —
          # it buys false confidence in the one file nothing else compiles.
          nvcc -O2 -std=c++17 -arch=sm_80 -c backend_cuda.cu -o /dev/null \
            -Xcompiler=-Wall,-Wextra
          echo "CUDA syntax check passed"
      - name: Compile backend_cuda_ink.cu (syntax only, no GPU)
        run: |
          cd c
          # inkling's own CUDA backend (bf16 residents + int4 expert GEMM); same
          # no-pipeline rule as above so a compile error can actually fail the job.
          nvcc -O2 -std=c++17 -arch=sm_80 -c backend_cuda_ink.cu -o /dev/null \
            -Xcompiler=-Wall,-Wextra
          echo "inkling CUDA syntax check passed"

  qwen36-tiny-check:
    name: Qwen3.6 tiny oracle (token-exact + ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: c/tools/oracle-requirements.txt
      - name: Install torch (CPU) + transformers
        run: pip install -r c/tools/oracle-requirements.txt
      - name: Tiny Qwen3.6-shaped fixture + full-hybrid oracle
        run: |
          cd c
          # Same layout as the 35B model (10 x (3 x DeltaNet -> MoE, 1 x Attention
          # -> MoE)) at toy dimensions, so the converter and the engine treat it
          # exactly like the real one. --mode full exercises BOTH layer kinds;
          # attention_only would leave the DeltaNet path untested.
          # The reference comes from make_qwen36_tiny.py, not make_qwen36_oracle.py:
          # the oracle encodes a text prompt through AutoTokenizer.from_pretrained(),
          # and this fixture is synthetic -- weights, no tokenizer. The tiny script
          # already has the model in memory and generates greedily from fixed ids.
          # --ref-mode full leaves BOTH layer kinds active; the default
          # attention_only replaces the 30 DeltaNet layers with identity, which is
          # what Phase 1 computed and would leave three quarters of the engine
          # untested.
          python3 tools/make_qwen36_tiny.py --out qwen36_tiny --ref-mode full \
                  --emit-ref qwen36_tiny/ref_full.json
          # ebits=8 keeps the expert quantization error below anything that could
          # flip a greedy argmax here -- measured. The DENSE weights are the ones
          # that matter: the engine quantizes them to int8 by default, the torch
          # reference does not, and that alone cost 7 of 16 tokens. The runs below
          # therefore set COLI_DENSE_I8=0, which is what the accuracy A/B in
          # 07_Tests uses for the same reason. Without it this gate compares two
          # different models and reddens on the luck of the draw.
          python3 tools/convert_qwen36.py --model qwen36_tiny --out qwen36_tiny_c --ebits 8
      - name: Token-exact against the oracle, at several cache capacities
        run: |
          cd c
          make qwen36
          # cap=1 evicts on every routed expert, which is where slot bookkeeping
          # breaks; cap=8 never would. That is not hypothetical here: the
          # in-flight eviction fallback this engine inherited was exactly such a
          # bug, and it only shows when cap is smaller than the number of loads
          # in flight. The engine exits non-zero on any token mismatch.
          for cap in 1 2 8; do
            echo "::group::cap=$cap"
            COLI_DENSE_I8=0 SNAP=qwen36_tiny_c \
              ./qwen36 "$cap" 8 qwen36_tiny/ref_full.json
            echo "::endgroup::"
          done
      - name: Same run under ASan + UBSan
        run: |
          cd c
          # Token-exactness alone would not have caught the config-driven heap
          # overflows this engine shipped with: they do not necessarily change
          # the output. The sanitizers are the half of this gate that watches
          # memory, and PILOT=1 puts concurrent expert loads against the cache
          # so the slot paths are exercised, not just walked past.
          #
          # This step asserts MEMORY SAFETY, not token-exactness -- the three
          # runs above already own that. -fsanitize changes inlining and
          # vectorization, so this is a differently-compiled binary, and float
          # reassociation can flip a token wherever the margin is thin. Demanding
          # exactness from it conflates two goals and made this job red on a
          # docs-only commit: the normal build matched 16/16, the sanitizer build
          # did not. So: run it, ignore a token mismatch, fail on any sanitizer
          # diagnostic.
          make clean >/dev/null 2>&1 || true
          make qwen36 EXTRA_CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 \
            COLI_DENSE_I8=0 SNAP=qwen36_tiny_c PILOT=1 WIDE=2 \
            ./qwen36 1 8 qwen36_tiny/ref_full.json > san.log 2>&1 || true
          if grep -qE "ERROR: AddressSanitizer|runtime error:" san.log; then
            echo "FAIL: sanitizer diagnostic under PILOT"; cat san.log; exit 1
          fi
          echo "sanitizers clean:"; grep -E "Matching tokens" san.log || true
      - name: A malformed container is refused, not read
        run: |
          cd c
          # The case ASan caught in review: config.json and qwen36_meta.json ship
          # in the same container and disagreed on the layer count, so is_attn was
          # sized from one and written from the other. Reproduced without the
          # guard as a heap-buffer-overflow WRITE at load_meta; with it the engine
          # refuses. A well-formed fixture cannot cover this, which is why it gets
          # its own step -- and it asserts the REFUSAL, so a guard that silently
          # stops guarding fails here.
          cp -r qwen36_tiny_c qwen36_tiny_bad
          python3 - <<'PY'
          import json
          p = "qwen36_tiny_bad/config.json"
          cfg = json.load(open(p))
          cfg["num_hidden_layers"] = 4          # meta says 8
          json.dump(cfg, open(p, "w"))
          PY
          if COLI_DENSE_I8=0 SNAP=qwen36_tiny_bad ./qwen36 8 8 \
               qwen36_tiny/ref_full.json > bad.log 2>&1; then
            echo "FAIL: engine accepted a container whose two config files disagree"
            cat bad.log; exit 1
          fi
          grep -q "config.json says 4 layers" bad.log || {
            echo "FAIL: refused, but not for the reason under test"; cat bad.log; exit 1; }
          echo "refused as expected:"; grep '^\[cfg\]' bad.log

  qwen38-tiny-check:
    name: Qwen3.8 tiny oracle (GDN + QSA + PLE + MoE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: c/tools/requirements-qwen38-tiny.txt
      - name: Install pinned Qwen4-Exp oracle dependencies
        run: pip install -r c/tools/requirements-qwen38-tiny.txt
      - name: Generate the upstream text fixture and run the token-and-logit oracle
        run: make -C c qwen38-tiny-check
      - name: Repeat the eviction path under ASan and UBSan
        run: |
          cd c
          make -B qwen38 EXTRA_CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 \
            OMP_NUM_THREADS=2 SNAP=./qwen38_tiny \
            ./qwen38 1 8 ./qwen38_tiny/ref.json > qwen38-san.log 2>&1
          if grep -qE "ERROR: AddressSanitizer|runtime error:" qwen38-san.log; then
            cat qwen38-san.log
            exit 1
          fi
          grep -q "Matching tokens: 8/8" qwen38-san.log
      - name: Refuse config and tensor-shape disagreement
        run: |
          cd c
          cp -r qwen38_tiny qwen38_tiny_bad
          python3 - <<'PY'
          import json
          path = "qwen38_tiny_bad/config.json"
          config = json.load(open(path, encoding="utf-8"))
          config["hc_count"] = 5
          json.dump(config, open(path, "w", encoding="utf-8"))
          PY
          if SNAP=./qwen38_tiny_bad ./qwen38 1 8 ./qwen38_tiny/ref.json > qwen38-bad.log 2>&1; then
            echo "FAIL: malformed Qwen3.8 container was accepted"
            cat qwen38-bad.log
            exit 1
          fi
          grep -qE "elements, expected|gated residual dimensions" qwen38-bad.log

  inkling-oracle:
    name: Inkling oracle (token-exact vs transformers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: c/tools/oracle-requirements.txt
      - name: Install torch (CPU) + transformers
        run: pip install -r c/tools/oracle-requirements.txt
      - name: Build inkling
        run: cd c && make inkling
      - name: Tiny-model fixture + token-exact oracle (f32, bit-exact experts)
        run: |
          cd c
          # Random-init InklingForCausalLM via HF transformers, then the C engine
          # reproduces it token-for-token. bits=0 keeps experts f32 (bit-exact
          # forward); the greedy pass exits non-zero on any mismatch, so this
          # gate fails the moment a shared-code change regresses the engine.
          python3 tools/make_tiny_inkling.py tiny_inkling
          # The oracle at several cache capacities (#784): a capacity-1 cache
          # exercises eviction on every routed expert, which is where a slot
          # bookkeeping bug shows up and a capacity-8 run never would.
          for cap in 1 2 8; do
            SNAP=tiny_inkling ./inkling "$cap" 0 tiny_inkling/ref_inkling.json
          done
      - name: KV prefix reuse is token-identical (serve, two turns)
        run: |
          cd c
          # Reusing a previous turn's attention state must change the timing and
          # nothing else. A wrong reuse length does not crash -- it answers from
          # another conversation's state and still reads plausibly -- so this is
          # the only gate that would catch it. Needs the fixture above, which is
          # why it runs here and not in `make check`.
          INKLING_TINY=tiny_inkling python3 -m unittest -v tests.test_inkling_prefix_serve

  # The efficiency suite against the tiny GLM oracle. These 8 tests existed but
  # had never run anywhere: they looked for c/glm.exe, a name that stopped
  # existing at the glm -> colibri rename, so _engine_present() was False on
  # every platform and all of them skipped. With that fixed they need only the
  # generated fixture, same shape as inkling-oracle above.
  #
  # Only the four that assert STRUCTURE are run, not the throughput floor:
  # a shared runner's tok/s is not reproducible, and a flaky perf gate gets
  # muted within a week. What these catch is real all the same -- the telemetry
  # lines the whole efficiency tooling parses, PROFILE phases going missing or
  # negative (double-counting), a fully-resident model becoming I/O bound, and
  # two identical greedy runs diverging.
  efficiency:
    name: Efficiency suite (tiny oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: c/tools/oracle-requirements.txt
      - name: Install torch (CPU) + transformers
        run: pip install -r c/tools/oracle-requirements.txt
      - name: Build colibri
        run: make -C c colibri
      - name: Integer-kernel exactness vs pure-C reference (#1081)
        # Integer kernels have no rounding excuse: bit-equality on every ISA.
        # The same binary check runs on the ARM job below — this is the gate
        # that would have caught the olmoe/qwen36/inkling IDOT class.
        run: |
          cd c
          gcc -O3 -march=native -fopenmp -I. tests/test_int_kernel_exact.c -o /tmp/tike -lm
          /tmp/tike
      - name: Generate the glm_tiny fixture
        run: cd c && python3 tools/make_glm_oracle.py
      - name: Token-exact oracle (teacher forcing)
        # The fixture is only trustworthy if the engine reproduces it, so assert
        # that before reading anything else out of a run.
        run: cd c && SNAP=./glm_tiny TF=1 COLI_TEMP=0 ./colibri 64 16 16
      - name: Structural efficiency tests
        # test_cpu_vs_cpu_tok_s_stability is NOT in this list: it is a tok/s
        # bound (two runs within 25%) over a ~15 ms tiny replay -- it measured
        # 38.8% between two identical runs on a quiet local box, so a shared
        # runner would make it flaky on day one. The determinism test (hit-rate
        # identical across two greedy replays) carries no timing assertion any
        # more, so it CAN run here -- and it is the one that catches stray
        # threading / uninitialized state.
        run: |
          cd c
          python3 -m unittest -v \
            tests.test_inefficiency.TinyEfficiencyTest.test_telemetry_parses \
            tests.test_inefficiency.TinyEfficiencyTest.test_profile_phases_present_and_nonneg \
            tests.test_inefficiency.TinyEfficiencyTest.test_disk_wait_not_dominant \
            tests.test_inefficiency.TinyEfficiencyTest.test_cpu_vs_cpu_determinism

  # The token-exact parity gate from #7 (c/tests/test_cluster_sharding.py): the
  # engine's local CPU run must already reproduce the transformers oracle
  # token-exactly, and delegating the routed-expert shard to a cluster worker
  # must not perturb a single position. It exercises the fmt=6 (E8/IQ3,
  # rotation-bearing) path and its fmt=4 (grouped int4, no-rotation) control.
  #
  # Not in `make check`: the two fixtures are gitignored (regenerated, not
  # committed -- see .gitignore) and need the pinned torch/transformers to
  # build, the same rationale as inkling-oracle and efficiency above. The test
  # skips cleanly when the fixtures are absent, so leaving fixture generation
  # out of CI would turn the gate into a silent no-op on a clean host -- the
  # worker path would never actually run. This job regenerates both fixtures
  # first so the gate is exercised, not dormant.
  #
  # Socket safety: the test spawns a cluster worker subprocess and a
  # coordinator, each binding a 127.0.0.1 port obtained from _free_port()
  # (bind to port 0), so it is safe on a shared runner.
  cluster-parity:
    name: Cluster parity gate (fmt6/fmt4, token-exact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: c/tools/oracle-requirements.txt
      - name: Install torch (CPU) + transformers
        run: pip install -r c/tools/oracle-requirements.txt
      - name: Build colibri
        run: make -C c colibri
      - name: Generate the fmt6/fmt4 quantized fixtures
        run: cd c && python3 tools/make_glm_oracle.py --fmt6 && python3 tools/make_glm_oracle.py --fmt4
      - name: Cluster parity gate (token-exact)
        run: cd c && python3 -m unittest -v tests.test_cluster_sharding

  engine-hip-syntax:
    name: HIP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        # rocm/dev images are large; hosted runners need the headroom freed
        # BEFORE the pull (which is why this is not a container: job).
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Compile backend_cuda.cu + test binary with hipcc (no GPU)
        run: |
          # Tag pinned: `latest` outgrew the runner disk once already. The
          # gcc-side engine link is skipped: containerized gcc/ld cannot link
          # ROCm runtime libs (both 22.04 and 24.04 bases); the hipcc-driver
          # link of the test binary below covers the single-source claim, and
          # the engine link is exercised on real ROCm hardware (GPU_BACKENDS.md).
          docker run --rm -v "$PWD":/src -w /src rocm/dev-ubuntu-24.04:6.2 bash -c '
            apt-get update && apt-get install -y --no-install-recommends make gcc g++ rocwmma-dev binutils &&
            make -C c gpu-compile HIP=1 HIP_ARCH=gfx1100 &&
            # The engine link is skipped here (see above), so assert the property
            # that link needs instead: backend_cuda.o must be position-independent.
            # hipcc emits a non-PIC/PIE object unless told otherwise, while gcc
            # links -pie by default on the distros users build on, so absolute
            # 32-bit relocations here mean `make HIP=1 colibri` dies with
            #   R_X86_64_32 ... can not be used when making a PIE object
            # That is exactly what happened before -fPIE was added to HIPCCFLAGS:
            # this job stayed green over a HIP build that could not link at all,
            # because gpu-compile links the TEST binary with the hipcc driver
            # (PIC-agnostic) and never runs the gcc engine link. One readelf keeps
            # that regression from silently coming back.
            if readelf -r c/backend_cuda.o | grep -qE "R_X86_64_32S?"; then
              echo "backend_cuda.o has absolute 32-bit relocations: the PIE link of colibri will fail (HIPCCFLAGS needs -fPIE or -fPIC)" >&2
              exit 1
            fi'
          echo "HIP syntax check passed"

  windows-cuda-build:
    # The Windows CUDA path has no coverage anywhere: `engine-cuda-syntax` above
    # compiles with nvcc's *GCC* host on Linux, and check.yml's windows job is
    # MinGW/UCRT64 CPU-only by design (#140). But nvcc on Windows requires MSVC
    # as its host compiler — it does not accept MinGW — so `make cuda-dll` runs a
    # toolchain nothing else in CI touches. That gap is not theoretical: every
    # bug in #158 was a *build* failure on this path (MSVC rejects the GCC-style
    # -Xcompiler=-Wall,-Wextra with "D8021 invalid numeric argument '/Wextra'",
    # unresolvable CUDA_HOME/NVCC defaults, POSIX setenv in the kernel test), and
    # #314 was CUDA_HOME with spaces — the layout the CUDA installer ships by
    # default. Both classes are compile-time and need no GPU to catch.
    #
    # Build-only ON PURPOSE: GitHub's hosted runners have no NVIDIA device, so
    # this job proves the Windows+MSVC CUDA build stays buildable, NOT that the
    # kernels or the DLL loader behave on real silicon. That still needs hardware
    # (see #157). Claiming otherwise would be the false confidence the
    # engine-cuda-syntax comment above already warns about.
    name: CUDA build (Windows, MSVC host)
    # windows-2022, NOT windows-latest: the latest image now ships Visual Studio
    # 18 (MSVC 14.5x), and CUDA's crt/host_config.h hard-errors on any host newer
    # than VS 2022 ("Only the versions between 2017 and 2022 (inclusive) are
    # supported"). That is a real constraint for every CUDA user on Windows, not
    # a CI quirk — pinning tracks what the toolkit actually supports. Revisit when
    # a CUDA release accepts VS 18; -allow-unsupported-compiler would only mask it.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: MSVC environment (puts cl.exe on PATH for nvcc -ccbin)
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install CUDA toolkit (compiler only)
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          # Same pin as engine-cuda-syntax: v0.2.19's version table stops at
          # 12.6.2. This installs to the default "C:\Program Files\NVIDIA GPU
          # Computing Toolkit\..." path, so CUDA_HOME is space-bearing here —
          # which is exactly the #314 regression this job would have caught.
          cuda: '12.6.2'
          method: network
          # cudart as well as nvcc: unlike the Linux job (which only needs to
          # *compile* backend_cuda.cu), cuda-dll links it, and on Windows the
          # runtime headers/import lib ship as a separate installer component —
          # with '["nvcc"]' alone this fails at `#include <cuda_runtime.h>`.
          sub-packages: '["nvcc", "cudart"]'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          # inherit: cl.exe (msvc-dev-cmd) and nvcc (cuda-toolkit) are added to
          # the *Windows* PATH by the steps above; without inheriting it the
          # recipe's `command -v` guards fail inside the MSYS2 shell.
          path-type: inherit
          install: >-
            make
            git
            mingw-w64-ucrt-x86_64-gcc
      # The DeepSeek V4 DeepGEMM flavour compiles against a pinned checkout
      # that tools/fetch_deepgemm.sh makes on first use (nothing vendored).
      # CI cannot compile it (sm_120a needs CUDA >= 12.8; this job pins 12.6)
      # but it does exercise the fetch — pin verification + MSVC patch — and
      # caches the tree keyed on the pin so a bump is the only cache miss.
      - name: DeepGEMM pin (for the cache key)
        id: deepgemm-pin
        shell: bash
        run: echo "pin=$(sed -n 's/^DEEPGEMM_PIN ?= //p' c/Makefile | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned DeepGEMM checkout
        uses: actions/cache@v4
        with:
          path: c/third_party/deepgemm
          key: deepgemm-${{ steps.deepgemm-pin.outputs.pin }}-${{ hashFiles('c/patches-deepgemm-sm120-msvc.patch') }}
      - name: make deepgemm-fetch (pinned checkout + MSVC patch, no compile)
        shell: msys2 {0}
        run: |
          cd c
          make deepgemm-fetch
          test -f third_party/deepgemm/deep_gemm/include/deep_gemm/impls/sm120_bf16_gemm.cuh || { echo "fetch_deepgemm produced no sm120 headers" >&2; exit 1; }
          # second run must be a no-op (idempotency)
          make deepgemm-fetch | grep -q "already at" || { echo "fetch_deepgemm is not idempotent" >&2; exit 1; }
      - name: make cuda-dll (nvcc + MSVC host)
        shell: msys2 {0}
        run: |
          cd c
          # CUDA_ARCH is pinned: the default is `native`, which asks the driver
          # what card is present — there is none here, so it must be explicit.
          # sm_80 matches engine-cuda-syntax and is supported by the 12.6 pin.
          make cuda-dll CUDA_ARCH=sm_80
          test -f coli_cuda.dll || { echo "cuda-dll reported success but produced no DLL" >&2; exit 1; }
          echo "coli_cuda.dll built (MSVC host)"
      - name: make colibri CUDA_DLL=1 (host links backend_loader, not cudart)
        shell: msys2 {0}
        run: |
          cd c
          make colibri CUDA_DLL=1
          test -f colibri.exe || { echo "colibri CUDA_DLL=1 reported success but produced no exe" >&2; exit 1; }
          echo "colibri.exe built against the DLL loader"

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npx vitest run

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Sette test in tests/test_kimi_usage_cli.py e tests/test_inkling_prefix_serve.py
      # sono protetti da skipUnless(ENGINE.exists()). Questo job non compilava
      # nessun motore, quindi si saltavano tutti e sette e il job restava verde
      # perche' era vuoto -- la stessa forma del job dei sanitizer che
      # rieseguiva un binario non strumentato. Uno di quei test era rosso da
      # settimane senza che nessuno potesse vederlo.
      - name: Build the engines those tests exercise
        run: make -C c kimi_k3 inkling
      - name: Python test suite
        run: cd c && python3 -m unittest discover -s tests -p 'test_*.py'

  windows-python-focused:
    name: Python tests (Windows focused)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Converter and launcher tests
        shell: pwsh
        run: |
          cd c
          $suites = @(
            'tests.test_launcher_dispatch'
            'tests.test_inkling_converter_lock'
            'tests.test_convert_positioned_write'
          )
          python -m unittest -v @suites

  # ARM oracle (#1081): every tiny-oracle job above runs on x86, so NEON
  # branches were never compiled, let alone executed — which is how the
  # olmoe (#1044) / qwen36 (#712 review) / inkling (#1080) IDOT class shipped.
  # This job builds every engine on arm64 (NEON compile coverage), runs the
  # integer-kernel bit-exactness gate with the NEON branches live, and replays
  # the glm_tiny teacher-forcing oracle against a fixture generated on THIS
  # runner (same-machine torch reference, so no cross-ISA float excuses).
  oracle-arm:
    name: ARM (engines + NEON kernel exactness + tiny oracle)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: c/tools/oracle-requirements.txt
      - name: Install torch (CPU) + transformers
        run: pip install -r c/tools/oracle-requirements.txt
      - name: Build every engine (NEON branches must compile)
        run: make -C c colibri inkling kimi_k3 olmoe
      - name: Integer-kernel exactness, NEON branches live (#1081)
        run: |
          cd c
          gcc -O3 -mcpu=native -fopenmp -I. tests/test_int_kernel_exact.c -o /tmp/tike -lm
          /tmp/tike
      - name: Generate the glm_tiny fixture on this runner
        run: cd c && python3 tools/make_glm_oracle.py
      - name: Token-exact oracle on ARM (teacher forcing)
        run: cd c && SNAP=./glm_tiny TF=1 COLI_TEMP=0 ./colibri 64 16 16
