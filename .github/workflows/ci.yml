name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# CI only reads the tree; no job here writes to the repo. Pin the token to
# read-only so a compromised step (or action) cannot push, tag or release.
permissions:
  contents: read

jobs:
  engine:
    name: Engine (Linux, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build colibri + inkling
        run: cd c && make colibri inkling
      - name: C test suite
        run: cd c && make test-c

  # Every engine, on every platform a release archive is built for. Before this,
  # CI built colibri + inkling on Linux only and kimi_k3 on nothing -- so the fact
  # that inkling and kimi_k3 did not compile under msys2/UCRT64 at all was invisible
  # for months, and binary releases silently shipped the GLM engine alone (#720).
  # Each engine is built separately so one failure does not mask the others.
  # The container image. Nothing built docker/Dockerfile.slim in CI before, so a
  # rename or a moved file under c/ could break the image and only a user would
  # find out -- the same gap the .mm and fuzz-rans paths had.
  #
  # Only Dockerfile.slim is built here, on purpose. docker/Dockerfile does
  # `git clone` of the upstream repo (that is its point -- README's zero-setup
  # path downloads that one file and needs no checkout), so building it in CI
  # would test upstream/main rather than this PR. Its Dockerfile is linted for
  # syntax instead.
  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the slim image
        run: docker build -t colibri:ci -f docker/Dockerfile.slim .
      - name: The image actually runs
        # Building is not the same as working: a missing COPY only shows up when
        # the entrypoint tries to import what is not there. --version needs no
        # model, so it exercises the launcher end to end without a 372 GB mount.
        run: |
          docker run --rm colibri:ci --version
          docker run --rm colibri:ci --help > /dev/null
          # The gateway has runtime modules that launcher-only commands do not
          # import. Exercise that boundary so the advertised serve path cannot
          # ship with a missing Python file.
          docker run --rm --entrypoint python3 colibri:ci -c \
            "import openai_server; print('gateway imports')"
      - name: The engine binary is in the image and is executable
        run: docker run --rm --entrypoint /app/colibri colibri:ci --help 2>&1 | head -5 || true
      - name: Lint both Dockerfiles
        # docker/Dockerfile is not built here (see above) but it is still shipped
        # and followed by users, so it gets checked for syntax at least.
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error
  # The C suite under AddressSanitizer + UndefinedBehaviorSanitizer.
  #
  # Before this the only sanitized code in CI was nothing at all: fuzz-rans has
  # always built with ASan+UBSan but was never wired to a job, and it covers
  # rans.h alone. The engine's pointer arithmetic, mmap/pread paths and worker
  # threads had never been run under a sanitizer here.
  #
  # Leak detection is off on purpose -- the engines allocate the tensor index,
  # parsed config and weight slabs once and use them until exit (st.h calls this
  # out: "intentionally leaked ... one-time startup parsing"). Reporting those
  # would bury the findings that matter under noise nobody intends to fix. The
  # flags live in c/Makefile's test-asan target, not here, so the same command
  # reproduces it locally.
  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C suite under ASan + UBSan
        run: make -C c test-asan
      - name: rANS fuzz round-trip (ASan + UBSan)
        # Already sanitized and already asserting byte identity across every
        # compiled decode arm; it just had no job to run in.
        run: make -C c fuzz-rans

  # The Vulkan backend, COMPILED AND RUN. Before this job, `grep -rn "VK=1\|glslc\|vulkan"
  # .github/workflows/` returned nothing: backend_vulkan.c and the four GLSL shaders were
  # never built by any job, so they could be broken on dev and every check would stay green.
  # Three Vulkan PRs were open at the time this landed, all written by people without the
  # hardware and reviewed by reading the diff.
  #
  # Lavapipe (Mesa's software Vulkan) is what makes running it possible without a GPU. It
  # says NOTHING about performance -- it is a CPU rasteriser and will be slower than the
  # ordinary CPU path -- and it does not reproduce driver-specific behaviour, such as the
  # VK_EXT_memory_budget under-reporting on RADV RX 6000 reported in #891. What it does
  # prove is that the shaders compile, the device and queue negotiation works, the expert
  # tier initialises, and the code path executes at all.
  vulkan:
    name: Vulkan (Lavapipe, software)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Vulkan toolchain and a software driver
        run: |
          sudo apt-get update
          # libvulkan-dev: headers + loader. glslc: compiles the .comp shaders to SPIR-V --
          # neither is present on the runner by default, which is half of why VK=1 was
          # never built here. mesa-vulkan-drivers carries Lavapipe (lvp).
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev glslc mesa-vulkan-drivers
      - name: Build with VK=1
        run: |
          cd c
          make colibri VK=1
          # The shaders are a separate failure mode from the C: glslc can reject a .comp
          # while backend_vulkan.c compiles perfectly. Assert all four exist.
          ls -l shaders/qmatmul.spv shaders/qmatmul_gate_up.spv \
                shaders/attention_absorb.spv shaders/rmsnorm.spv
          ldd colibri | grep -q libvulkan || { echo "FAIL: built without linking libvulkan"; exit 1; }
      - name: Initialise the backend against Lavapipe
        run: |
          cd c
          # A config.json is enough to reach coli_vk_init(): it runs before any weight is
          # read, so the run fails afterwards on the missing model and that is expected.
          # What is asserted is the [VK] banner, not a successful load.
          mkdir -p /tmp/vkprobe
          echo '{"model_type":"glm_moe_dsa"}' > /tmp/vkprobe/config.json
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json \
          COLI_NO_OMP_TUNE=1 COLI_VULKAN=1 SNAP=/tmp/vkprobe \
            timeout 120 ./colibri > vk.log 2>&1 || true
          cat vk.log
          # coli_vk_init() returns 0 and the engine exits 2 with "Vulkan backend
          # unavailable" when the loader finds no device or the shaders are missing, so
          # this line is the whole gate.
          grep -q "\[VK\] ready:" vk.log || {
            echo "FAIL: the Vulkan backend did not initialise"; exit 1; }
          grep -q "expert tier active" vk.log || {
            echo "FAIL: Vulkan initialised but the expert tier did not activate"; exit 1; }
          echo "OK: shaders compiled, device negotiated, expert tier active"
      - name: Every qmatmul weight format against a CPU reference
        run: |
          cd c
          # int8, int4, grouped int4, int3, f32, bf16 and fp8-e4m3, through the staged,
          # batched and unstaged paths and odd widths, before any engine is involved.
          bash tests/vulkan_engines.sh shader
      - name: Staged device-local uploads against mapped memory
        run: |
          cd c
          # The path a discrete card without Resizable BAR takes (docs/vulkan.md, "Memory
          # placement without Resizable BAR"), forced here: the harness's results bit for
          # bit equal mapped, staged and under an emulated 246 MB window, which must
          # choose staging on its own; then the formats, the tier and the chain's ops staged.
          bash tests/vulkan_engines.sh staged
          COLI_VK_STAGED=1 bash tests/vulkan_engines.sh shader

  # Every engine with a Vulkan hook, run twice on its tiny fixture: on the CPU and on
  # Lavapipe, with the same snapshot and settings. The gate is the CPU's tokens (and
  # the engine's own oracle where the configuration is the one it was built for) plus
  # a non-zero "[VK] <engine>: N matmuls on the GPU": a hook that declined every
  # matrix would otherwise pass. One leg per family keeps each under its timeout.
  vulkan-engines:
    name: Vulkan engines (${{ matrix.family }}, Lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: qwen
            req: c/tools/requirements-qwen38-tiny.txt
          # the routed-expert tier of qwen36 and qwen38 under ASan and UBSan
          - family: qwen-sanitize
            req: c/tools/requirements-qwen38-tiny.txt
          # the dense chain (COLI_VK_CHAIN=1) of qwen36 and qwen38, and the same under
          # ASan and UBSan
          - family: qwen-chain
            req: c/tools/requirements-qwen38-tiny.txt
          - family: qwen-chain-sanitize
            req: c/tools/requirements-qwen38-tiny.txt
          # speculative decoding with deeper verifies (MTP drafts up to 3, prompt-lookup
          # drafts up to 5) on qwen36 and qwen38: against plain decoding on the CPU and
          # in the dense chain, and the same under ASan and UBSan
          - family: qwen-spec
            req: c/tools/requirements-qwen38-tiny.txt
          - family: qwen-spec-sanitize
            req: c/tools/requirements-qwen38-tiny.txt
          # staged device-local uploads (COLI_VK_STAGED=1): the tier and the chain of qwen36
          # and qwen38, and an engine choosing staging on its own under an emulated window
          - family: qwen-staged
            req: c/tools/requirements-qwen38-tiny.txt
          - family: qwen-chain-staged
            req: c/tools/requirements-qwen38-tiny.txt
          # staged uploads failing at every point they can (COLI_VK_STAGED_FAULT): qwen36's
          # matrices, tier and chain, colibri's KV mirror; the CPU's tokens, and the same
          # under ASan and UBSan
          - family: staged-faults
            req: c/tools/requirements-qwen38-tiny.txt
          - family: staged-faults-sanitize
            req: c/tools/requirements-qwen38-tiny.txt
          - family: inkling-olmoe
            req: c/tools/oracle-requirements.txt
          # the routed-expert tier of inkling and olmoe under ASan and UBSan
          - family: inkling-olmoe-sanitize
            req: c/tools/oracle-requirements.txt
          # the dense chain (COLI_VK_CHAIN=1) of inkling and olmoe, and the same under
          # ASan and UBSan
          - family: inkling-olmoe-chain
            req: c/tools/oracle-requirements.txt
          - family: inkling-olmoe-chain-sanitize
            req: c/tools/oracle-requirements.txt
          - family: mimo-qwenimage
            req: c/tools/requirements-qwenimage-tiny.txt
          - family: deepseek
            req: c/tools/requirements-deepseek-v4-tiny.txt
            extra: sympy pillow   # the V4.1 fixture's reference and its vision tower
          # the routed-expert tier of deepseek_v41 and deepseek_v4 under ASan and UBSan
          - family: deepseek-sanitize
            req: c/tools/requirements-deepseek-v4-tiny.txt
            extra: sympy pillow
          # Kimi K3's routed experts on the shared tier, and its and MiMo's tier under
          # ASan and UBSan (MiMo's tier runs in mimo-qwenimage)
          - family: kimi
            req: c/tools/requirements-kimi-k3-tiny.txt
          - family: kimi-mimo-sanitize
            req: c/tools/requirements-mimo-tiny.txt
          # MiMo-V2.6's dense chain (COLI_VK_CHAIN=1), and the same under ASan and UBSan
          - family: mimo-chain
            req: c/tools/requirements-mimo-tiny.txt
          - family: mimo-chain-sanitize
            req: c/tools/requirements-mimo-tiny.txt
          # GLM-5.2 (colibri) and GLM-5.3 Flash (glm53) on the routed-expert tier, and
          # the same under ASan and UBSan
          - family: glm
            req: c/tools/requirements-glm53-tiny.txt
          - family: glm-sanitize
            req: c/tools/requirements-glm53-tiny.txt
          # the dense chain (COLI_VK_CHAIN=1) of colibri and glm53: the MLA, KDA and mHC
          # ops, and the same under ASan and UBSan
          - family: glm-chain
            req: c/tools/requirements-glm53-tiny.txt
          - family: glm-chain-sanitize
            req: c/tools/requirements-glm53-tiny.txt
          # the dense chain (COLI_VK_CHAIN=1) of deepseek_v41 and deepseek_v4, and the same
          # under ASan and UBSan
          - family: deepseek-chain
            req: c/tools/requirements-deepseek-v4-tiny.txt
            extra: sympy pillow
          - family: deepseek-chain-sanitize
            req: c/tools/requirements-deepseek-v4-tiny.txt
            extra: sympy pillow
          # the dense chain (COLI_VK_CHAIN=1) of Kimi K3: its attention residuals, KDA
          # and gated MLA layers on the device, and the same under ASan and UBSan
          - family: kimi-chain
            req: c/tools/requirements-kimi-k3-tiny.txt
          - family: kimi-chain-sanitize
            req: c/tools/requirements-kimi-k3-tiny.txt
          # the dense weights on the device only (COLI_VK_DENSE_HOST=0): the host copies
          # given back, the CPU's tokens, a lost device reading them back from disk;
          # one leg per engine group, staged, and the same under ASan and UBSan
          - family: dense-only-qwen38
            req: c/tools/requirements-qwen38-tiny.txt
          - family: dense-only-qwen38-staged
            req: c/tools/requirements-qwen38-tiny.txt
          - family: dense-only-qwen38-sanitize
            req: c/tools/requirements-qwen38-tiny.txt
          # qwen38's partial dense chain (the first N layers on the device, the rest and
          # the head on the CPU), and the same under ASan and UBSan
          - family: partial-qwen38
            req: c/tools/requirements-qwen38-tiny.txt
          - family: partial-qwen38-sanitize
            req: c/tools/requirements-qwen38-tiny.txt
          - family: dense-only-qwen36-olmoe
            req: c/tools/requirements-qwen38-tiny.txt
          - family: dense-only-qwen36-olmoe-sanitize
            req: c/tools/requirements-qwen38-tiny.txt
          # the partial chain of qwen36 and olmoe (the first N layers on the device, the
          # rest and the head on the CPU), and the same under ASan and UBSan
          - family: partial-qwen36-olmoe
            req: c/tools/requirements-qwen38-tiny.txt
          - family: partial-qwen36-olmoe-sanitize
            req: c/tools/requirements-qwen38-tiny.txt
          - family: dense-only-inkling-mimo-kimi
            req: c/tools/requirements-kimi-k3-tiny.txt
            extra: -r c/tools/oracle-requirements.txt pillow
          - family: dense-only-inkling-mimo-kimi-sanitize
            req: c/tools/requirements-kimi-k3-tiny.txt
            extra: -r c/tools/oracle-requirements.txt pillow
          - family: dense-only-glm
            req: c/tools/requirements-qwen38-tiny.txt
            extra: pillow
          - family: dense-only-glm-sanitize
            req: c/tools/requirements-qwen38-tiny.txt
            extra: pillow
          # the partial chain of colibri and glm53 (the first N layers on the device):
          # COLI_VK_CHAIN_LAYERS, COLI_VK_DEVICE_CAP_MB, an upload failing mid-setup, the
          # forward paths with N < L, and the same under ASan and UBSan
          - family: partial-glm
            req: c/tools/requirements-glm53-tiny.txt
            extra: pillow
          - family: partial-glm-sanitize
            req: c/tools/requirements-glm53-tiny.txt
            extra: pillow
          - family: dense-only-deepseek
            req: c/tools/requirements-deepseek-v4-tiny.txt
            extra: sympy pillow
          - family: dense-only-deepseek-sanitize
            req: c/tools/requirements-deepseek-v4-tiny.txt
            extra: sympy pillow
          # the partial chain (docs/vulkan.md, "A partial chain"): the first N layers on
          # the device and the CPU the rest, N forced, from a small device
          # (COLI_VK_DEVICE_CAP_MB) and after an upload failing mid-setup; every forward
          # path with N below the layers; one leg per engine group, and the same under
          # ASan and UBSan
          - family: partial-deepseek
            req: c/tools/requirements-deepseek-v4-tiny.txt
            extra: sympy pillow
          - family: partial-deepseek-sanitize
            req: c/tools/requirements-deepseek-v4-tiny.txt
            extra: sympy pillow
          # big prompt chunks and expert streaming (docs/vulkan.md): every chain engine on a
          # prompt past its usual block, the chunk from the budget, a forced small chunk and
          # streaming threshold, staged, the feature off, and the forced runs under ASan
          # and UBSan
          - family: prefill-qwen
            req: c/tools/requirements-qwen38-tiny.txt
          - family: prefill-qwen-sanitize
            req: c/tools/requirements-qwen38-tiny.txt
          - family: prefill-inkling-olmoe
            req: c/tools/oracle-requirements.txt
          - family: prefill-mimo-kimi
            req: c/tools/requirements-mimo-tiny.txt
          - family: prefill-glm
            req: c/tools/requirements-glm53-tiny.txt
          - family: prefill-deepseek
            req: c/tools/requirements-deepseek-v4-tiny.txt
            extra: sympy pillow
          # the KV cache split between the device and the host past the device's budget
          # (COLI_VK_KV_DEVICE_ROWS emulates a small device): every chain engine against its
          # CPU run, prefix reuse, serve sessions and a lost device across the split, and the
          # same under ASan and UBSan; DeepSeek's in legs of their own (their fixtures pin
          # another transformers)
          - family: kv-split
            req: c/tools/requirements-qwen38-tiny.txt
            extra: numpy pillow
          - family: kv-split-sanitize
            req: c/tools/requirements-qwen38-tiny.txt
            extra: numpy pillow
          - family: kv-split-deepseek
            req: c/tools/requirements-deepseek-v4-tiny.txt
            extra: sympy pillow
          - family: kv-split-deepseek-sanitize
            req: c/tools/requirements-deepseek-v4-tiny.txt
            extra: sympy pillow
          # the decision engines: Laya's and GLiNER2.5-Decide's forward on the device and
          # matrix by matrix, Clef's DECIDE on qwen36's paths in f32, int8 and f16, the
          # tiny oracles, the serve tests and TypeSafe's SDKs through the device; and the
          # same (but the SDKs) under ASan and UBSan
          - family: decide
            req: c/tools/requirements-jev-sdk.txt
            extra: -r c/tools/oracle-requirements.txt
            npm: c/tools/jev-sdk
          - family: decide-sanitize
            req: c/tools/requirements-jev-sdk.txt
            extra: -r c/tools/oracle-requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.req }}
      - name: Install the Vulkan toolchain, Lavapipe and the fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev glslc mesa-vulkan-drivers
          pip install -r ${{ matrix.req }} ${{ matrix.extra }}
      - name: The pinned TypeScript SDK
        if: ${{ matrix.npm }}
        run: cd ${{ matrix.npm }} && npm ci
      - name: CPU against Vulkan, engine by engine
        run: bash c/tests/vulkan_engines.sh ${{ matrix.family }}

  musl:
    name: musl libc (Alpine)
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      # #1430: colibri did not compile against musl, because malloc_trim is a
      # glibc extension guarded on __linux__ rather than on __GLIBC__. Nothing in
      # CI compiled against anything but glibc, so the only way to find out was
      # to be the user. One build leg closes that whole class.
      - name: Toolchain
        run: apk add --no-cache build-base linux-headers python3 git bash
      - uses: actions/checkout@v4
      - name: Build the engines musl can build
        run: |
          cd c
          # ARCH=x86-64: the runner's -march=native is not the point here, the
          # libc is. Engines that need glibc-only interfaces would fail loudly
          # rather than be excluded quietly, which is the report we want.
          make colibri ARCH=x86-64
          make olmoe ARCH=x86-64
      - name: The RAM guard still trims where it can
        run: |
          cd c
          # The fix skips malloc_trim on musl; on glibc it must still be called.
          # Here we only assert the build has no reference to it, which is the
          # half this leg can see.
          if nm colibri | grep -q malloc_trim; then
            echo "FAIL: malloc_trim linked in a musl build"; exit 1
          fi
          echo "ok: no glibc-only symbol in the musl binary"

  engines-all-platforms:
    name: All engines (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            shell: bash
            v4: "1"
          - os: macos-latest
            name: macos
            shell: bash
            # arm64 macOS joined COLI_V4_SUPPORTED: compat.h carries the
            # platform differences (fadvise/F_RDADVISE, O_DIRECT/F_NOCACHE)
            # and the token-exact tiny oracle below is the acceptance gate.
            v4: "1"

          - os: windows-latest
            name: windows
            # GitHub shells are format strings: 'msys2 {0}', never bare 'msys2'.
            shell: "msys2 {0}"
            v4: "1"
            # The same make_args as release.yml's windows row, so the shipped
            # configuration is built here before a tag builds it for the first
            # time. XDNA=1 needs nothing installed on the runner: the lane's host
            # side links no XRT, and the helper is loaded at runtime on request.
            make_args: "XDNA=1"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.os == 'windows-latest'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
      - if: matrix.os == 'macos-latest'
        run: brew install libomp
      # Keep the portable sibling list aligned with release packaging. DeepSeek
      # V4 remains conditional because its amalgamated target is unsupported on
      # one platform in this matrix.
      # The hyphenated target is appended rather than folded into the loop
      # because it must not run on macos.
      - name: Build every engine
        run: |
          cd c
          rc=0
          ENGINES="colibri glm53 inkling kimi_k3 olmoe qwen36 qwen38 deepseek_v41 mimo qwenimage laya gliner_decide"
          if [ "${{ matrix.v4 }}" = "1" ]; then ENGINES="$ENGINES deepseek-v4"; fi
          for t in $ENGINES; do
            echo "::group::$t"
            make $t ${{ matrix.make_args }} || { echo "FAILED: $t"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc
      - if: matrix.os == 'windows-latest'
        name: "The release configuration is what got built (XDNA=1)"
        run: |
          cd c
          # A switch that silently did nothing would still leave the loop above
          # green, so check the binary rather than the command line. Only an
          # XDNA=1 host carries the helper's name (its LoadLibraryExA argument),
          # and only a default host carries the "no XDNA support" answer.
          if ! grep -aq 'coli_xdna.dll' colibri.exe; then
            echo "FAIL: colibri.exe was built without the XDNA lane"; exit 1
          fi
          if grep -aq 'this build has no XDNA support' colibri.exe; then
            echo "FAIL: colibri.exe is the default build, not XDNA=1"; exit 1
          fi
          # The lane must not cost the ordinary download a dependency: XRT and
          # the helper are resolved at runtime, only when the user asks.
          imports=$(objdump -p colibri.exe | sed -n 's/.*DLL Name: //p' | tr 'A-Z' 'a-z')
          echo "$imports"
          if echo "$imports" | grep -Eq '^(xrt_core|xrt_coreutil|coli_xdna)\.dll'; then
            echo "FAIL: the XDNA=1 host imports XRT or the helper"; exit 1
          fi
          echo "OK: colibri.exe carries the XDNA lane and imports neither XRT nor the helper"
      - name: "Environment shims: setenv is visible to getenv in-process"
        run: |
          cd c
          # This is the one gate that has to run OFF Linux. compat.h's setenv
          # used to write only the Win32 block, which getenv never reads, so
          # the C suite on the Linux job could not see the defect at all.
          make tests/test_compat_env
          ./tests/test_compat_env
      - name: "C tests that drive the engine through the environment"
        run: |
          cd c
          # `make test-c` runs on the Linux leg only, so every test that sets an
          # environment variable was unobservable on the platform whose shim it
          # depends on. That is how fourteen of them ended up carrying a private
          # _putenv_s helper (#1420, #1429). These two are the cheapest pair that
          # actually exercises the shim through engine code.
          for t in tests/test_omp_tune tests/test_qwen36_ctx; do
            echo "::group::$t"
            make $t
            ./$t
            echo "::endgroup::"
          done
      - if: matrix.os == 'macos-latest'
        name: Build every Metal-capable engine with METAL=1
        # `make <engine>` above builds the CPU path only: everything behind
        # COLI_METAL is invisible to it. That is how #1150 survived a month --
        # inkling.c kept calling coli_metal_moe_block with the pre-qgs
        # signature from v1.6.0 onward and no job ever compiled the call.
        # Compile-only by necessity: the runner's Apple Paravirtual device
        # cannot execute Metal submissions (see the note below), but signature
        # drift is a compile error, which is exactly what this catches.
        run: |
          cd c
          rc=0
          for t in colibri inkling kimi_k3; do
            echo "::group::$t METAL=1"
            make clean >/dev/null 2>&1 || true
            make $t METAL=1 || { echo "FAILED: $t METAL=1"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc
      - if: matrix.os == 'macos-latest'
        name: Metal backend tests
        # The Metal backend suite is its own target (metal-test) and is not
        # part of `make check`: TEST_BINS is derived from tests/test_*.$(EXE)
        # rules, and backend_metal_test is built/run by the metal-test target
        # itself. Nothing in CI exercised it until issue #940 shipped a
        # compile error in it, so run it explicitly on the Apple Silicon
        # runners.
        # The runner's Apple Paravirtual device hangs on Metal submissions
        # (observed: 47 min vs a 5-6 min normal run), so the test harness
        # detects it and skips GPU execution with an explicit line; this
        # timeout is the backstop that turns any residual hang into a red X.
        timeout-minutes: 10
        run: |
          cd c
          make metal-test

      # macOS is the newest COLI_V4_SUPPORTED platform and the only one whose
      # engine coverage lives solely in this job (Linux has the v4-tiny job in
      # check.yml, Windows was first exercised at the release tag). The tiny
      # oracle is the token-exactness gate: it fails on any numerical or I/O
      # divergence, which is exactly what a platform port can break.
      #
      # The check target REGENERATES the fixture (--force) before comparing,
      # so it needs the same pinned torch/transformers the Linux v4-tiny job
      # installs -- without them the step dies in generation, not in the
      # oracle (round 2 of this PR measured exactly that).
      - uses: actions/setup-python@v5
        if: matrix.os == 'macos-latest'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: c/tools/requirements-deepseek-v4-tiny.txt
      - name: Install pinned tiny-fixture dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: python -m pip install -r c/tools/requirements-deepseek-v4-tiny.txt
      - name: DeepSeek V4 tiny oracle (macOS)
        if: matrix.os == 'macos-latest'
        run: make -C c deepseek-v4-tiny-check

      # The Windows backend-DLL loader contract (c/tests/test_backend_loader.py)
      # had no CI anywhere: the `python` job below is Linux-only, where these
      # tests do not apply. They need no GPU and no HIP SDK — the fixtures are
      # stub DLLs this job's MinGW gcc/objdump build on the fly.
      #
      # shell: pwsh overrides the job default so the tests run outside the MSYS2
      # shell; MSYS2 is on PATH only so gcc/objdump/make are reachable for
      # fixture compilation. The tests themselves are separator-agnostic (they
      # normalise both sides before comparing), so neither interpreter choice nor
      # the shape of the temp root can decide the outcome.
      - name: Windows backend-loader contract tests (no GPU)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          # Nothing here may reach a real GPU, runtime or backend.
          COLI_CUDA: ''
          COLI_GPU: ''
          CUDA_DENSE: ''
          COLI_HIP_RUNTIME_DIR: ''
          HIP_PATH: ''
        run: |
          # ucrt64\bin for gcc/objdump AND usr\bin for make: without make, the
          # host-matrix class skips at setUpClass and the run silently loses
          # tests instead of failing.
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          $env:PATH = "$msys\ucrt64\bin;$msys\usr\bin;$env:PATH"
          foreach ($v in 'COLI_CUDA','COLI_GPU','COLI_GPUS','CUDA_DENSE','CUDA_EXPERT_GB',
                         'COLI_HIP_RUNTIME_DIR','HIP_PATH','ROCM_PATH','ROCM_HOME',
                         'HIP_DEVICE_LIB_PATH','HSA_OVERRIDE_GFX_VERSION',
                         'HIP_VISIBLE_DEVICES','CUDA_VISIBLE_DEVICES') {
            Remove-Item "env:$v" -ErrorAction SilentlyContinue
          }
          python -c "import sys, os, tempfile; print('python', sys.executable); print('os.sep', repr(os.sep)); print('tmp', tempfile.gettempdir())"
          gcc --version | Select-Object -First 1
          make --version | Select-Object -First 1
          cd c
          $out = python -m unittest tests.test_backend_loader -v 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { throw "loader contract tests failed" }
          # A missing toolchain shows up as setUpClass skips, not failures, so a
          # green run with a shrunken test count would hide the real problem.
          if ($out -notmatch '(?m)^Ran (\d+) tests') { throw "could not parse the test count" }
          $ran = [int]$Matches[1]
          $skipped = ([regex]::Matches($out, '\.\.\. skipped')).Count
          "ran=$ran skipped=$skipped"
          if ($skipped -gt 0) { throw "$skipped loader test(s) skipped: the Windows toolchain is incomplete" }

  engine-cuda-syntax:
    name: CUDA syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA toolkit (compiler only)
        uses: Jimver/cuda-toolkit@4bd727d5619dc6fa323b1e76c3aa5dca94f5ec6d # v0.2.19
        with:
          # v0.2.19's version table stops at 12.6.2 — 12.6.3 fails the install
          # step with "Version not available" before nvcc is ever reached.
          cuda: '12.6.2'
          method: network
          sub-packages: '["nvcc"]'
      - name: Compile backend_cuda.cu (syntax only, no GPU)
        run: |
          cd c
          # NOT `nvcc ... | head -40`: a pipeline exits with the status of its
          # LAST command, so head's 0 masked every nvcc error and the job could
          # only ever be green. A check that cannot fail is worse than no check —
          # it buys false confidence in the one file nothing else compiles.
          nvcc -O2 -std=c++17 -arch=sm_80 -c backend_cuda.cu -o /dev/null \
            -Xcompiler=-Wall,-Wextra
          echo "CUDA syntax check passed"
      - name: Compile backend_cuda_ink.cu (syntax only, no GPU)
        run: |
          cd c
          # inkling's own CUDA backend (bf16 residents + int4 expert GEMM); same
          # no-pipeline rule as above so a compile error can actually fail the job.
          nvcc -O2 -std=c++17 -arch=sm_80 -c backend_cuda_ink.cu -o /dev/null \
            -Xcompiler=-Wall,-Wextra
          echo "inkling CUDA syntax check passed"

  qwen36-tiny-check:
    name: Qwen3.6 tiny oracle (token-exact + ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: c/tools/oracle-requirements.txt
      - name: Install torch (CPU) + transformers
        run: pip install -r c/tools/oracle-requirements.txt
      - name: Tiny Qwen3.6-shaped fixture + full-hybrid oracle
        run: |
          cd c
          # Same layout as the 35B model (10 x (3 x DeltaNet -> MoE, 1 x Attention
          # -> MoE)) at toy dimensions, so the converter and the engine treat it
          # exactly like the real one. --mode full exercises BOTH layer kinds;
          # attention_only would leave the DeltaNet path untested.
          # The reference comes from make_qwen36_tiny.py, not make_qwen36_oracle.py:
          # the oracle encodes a text prompt through AutoTokenizer.from_pretrained(),
          # and this fixture is synthetic -- weights, no tokenizer. The tiny script
          # already has the model in memory and generates greedily from fixed ids.
          # --ref-mode full leaves BOTH layer kinds active; the default
          # attention_only replaces the 30 DeltaNet layers with identity, which is
          # what Phase 1 computed and would leave three quarters of the engine
          # untested.
          python3 tools/make_qwen36_tiny.py --out qwen36_tiny --ref-mode full \
                  --emit-ref qwen36_tiny/ref_full.json
          # ebits=8 keeps the expert quantization error below anything that could
          # flip a greedy argmax here -- measured. The DENSE weights are the ones
          # that matter: the engine quantizes them to int8 by default, the torch
          # reference does not, and that alone cost 7 of 16 tokens. The runs below
          # therefore set COLI_DENSE_I8=0, which is what the accuracy A/B in
          # 07_Tests uses for the same reason. Without it this gate compares two
          # different models and reddens on the luck of the draw.
          python3 tools/convert_qwen36.py --model qwen36_tiny --out qwen36_tiny_c --ebits 8
      - name: Token-exact against the oracle, at several cache capacities
        run: |
          cd c
          make qwen36
          # cap=1 evicts on every routed expert, which is where slot bookkeeping
          # breaks; cap=8 never would. That is not hypothetical here: the
          # in-flight eviction fallback this engine inherited was exactly such a
          # bug, and it only shows when cap is smaller than the number of loads
          # in flight. The engine exits non-zero on any token mismatch.
          for cap in 1 2 8; do
            echo "::group::cap=$cap"
            COLI_DENSE_I8=0 SNAP=qwen36_tiny_c \
              ./qwen36 "$cap" 8 qwen36_tiny/ref_full.json
            echo "::endgroup::"
          done
      - name: Qwen3.8-2.4T geometry, fused experts + mtp head (converter contract + token-exact)
        run: |
          cd c
          # The 2.4T checkpoint declares the same model_type as the 35B and
          # resolves to this engine (#1045). Its structural numbers at toy
          # widths: 92 layers / interval 4 / 512 experts top-10 / 16:1 attention
          # heads / 8:1 DeltaNet heads. The shard is rewritten into the layout
          # the real checkpoints ship -- fused expert tensors and an mtp.* head
          # -- so the converter is seen splitting the one and skipping the other
          # ON PURPOSE (it must say so), not by never selecting them.
          # --seed 3: the default seed collapses this geometry's reference to a
          # single repeated token, which a shape error could still reproduce.
          python3 tools/make_qwen36_tiny.py --geometry qwen38-2p4t --seed 3 \
                  --out qwen38_2p4t_tiny --ref-mode full \
                  --emit-ref qwen38_2p4t_tiny/ref_full.json
          python3 tools/convert_qwen36.py --model qwen38_2p4t_tiny \
                  --out qwen38_2p4t_tiny_c --ebits 8 | tee convert_2p4t.log
          grep -q "skipping 19 \`mtp.\*\` tensor" convert_2p4t.log
          grep -q "tensor kinds: 1587 in 92 layers, 3 globals" convert_2p4t.log
          # the container must not carry the head it skipped
          python3 - <<'EOF'
          import glob
          from safetensors import safe_open
          for path in glob.glob("qwen38_2p4t_tiny_c/*.safetensors"):
              with safe_open(path, "pt") as f:
                  assert not [k for k in f.keys() if k.startswith("mtp.")], path
          EOF
          for cap in 1 2 512; do
            echo "::group::2.4T geometry cap=$cap"
            COLI_DENSE_I8=0 SNAP=qwen38_2p4t_tiny_c \
              ./qwen36 "$cap" 8 qwen38_2p4t_tiny/ref_full.json
            echo "::endgroup::"
          done
      - name: "Qwen3-Coder geometry: qwen3_moe, every layer attention, no shared expert"
        run: |
          cd c
          # Qwen/Qwen3-Coder-30B-A3B-Instruct is Qwen3MoeForCausalLM: no DeltaNet, no
          # attention output gate, no shared expert, full rotary and plain RMSNorm
          # weights. The fixture draws its norms around 1 so a container that applied
          # them zero-centered could not pass, and the converter has to say so in the
          # meta; the engine runs it token for token against transformers.
          python3 tools/make_qwen36_tiny.py --geometry qwen3-coder-30b \
                  --out qwen3_coder_tiny --ref-mode full \
                  --emit-ref qwen3_coder_tiny/ref_full.json
          python3 tools/convert_qwen36.py --model qwen3_coder_tiny \
                  --out qwen3_coder_tiny_c --ebits 8
          python3 -c "import json; m = json.load(open('qwen3_coder_tiny_c/qwen36_meta.json')); \
                      assert (m['shared_inter'], m['zero_centered_norms'], m['partial_rotary_factor'], \
                              set(m['layer_types'])) == (0, False, 1.0, {'full_attention'}), m"
          for cap in 1 8; do
            echo "::group::Qwen3-Coder geometry cap=$cap"
            COLI_DENSE_I8=0 SNAP=qwen3_coder_tiny_c \
              ./qwen36 "$cap" 8 qwen3_coder_tiny/ref_full.json
            echo "::endgroup::"
          done
      - name: "Qwen3.8-27B geometry: a dense checkpoint of the same architecture (#1757)"
        run: |
          cd c
          # Qwen/Qwen3.8-27B is Qwen3_5ForConditionalGeneration: the hybrid
          # DeltaNet + gated attention of this engine with one SwiGLU MLP per
          # layer and no router. The converter has to write num_experts 0 and
          # the MLP width, and the engine has to run that MLP as an ungated
          # shared expert, token for token against Qwen3_5ForCausalLM.
          python3 tools/make_qwen36_tiny.py --geometry qwen38-27b-dense \
                  --out qwen38_27b_tiny --ref-mode full \
                  --emit-ref qwen38_27b_tiny/ref_full.json
          python3 tools/convert_qwen36.py --model qwen38_27b_tiny \
                  --out qwen38_27b_tiny_c --ebits 8
          python3 -c "import json; m = json.load(open('qwen38_27b_tiny_c/qwen36_meta.json')); \
                      assert (m['num_experts'], m['topk'], m['shared_inter']) == (0, 0, 128), m"
          for cap in 1 8; do
            echo "::group::27B dense geometry cap=$cap"
            COLI_DENSE_I8=0 SNAP=qwen38_27b_tiny_c \
              ./qwen36 "$cap" 8 qwen38_27b_tiny/ref_full.json
            echo "::endgroup::"
          done
          # The same model with its vision tower (Qwen3_5ForConditionalGeneration):
          # a prompt with one 4x8-patch image, token-exact against transformers.
          # Every position after the image depends on the 3D M-RoPE positions
          # (1D positions give 6/16 here), and the serve test holds the IMAGE
          # frame path to the same tokens.
          python3 tools/make_qwen36_vl_tiny.py --out qwen38_27b_vl_tiny
          python3 tools/convert_qwen36.py --model qwen38_27b_vl_tiny \
                  --out qwen38_27b_vl_tiny_c --ebits 8 | tee convert_vl.log
          grep -q "\[vision\] model-vision.safetensors" convert_vl.log
          for cap in 1 8; do
            echo "::group::27B vision cap=$cap"
            COLI_DENSE_I8=0 SNAP=qwen38_27b_vl_tiny_c \
              ./qwen36 "$cap" 8 qwen38_27b_vl_tiny/ref.json
            echo "::endgroup::"
          done
          QWEN36_VL_TINY=qwen38_27b_vl_tiny_c QWEN36_VL_REF=qwen38_27b_vl_tiny/ref.json \
            python3 -m unittest -v tests.test_qwen36_vision_serve
      - name: Same run under ASan + UBSan
        run: |
          cd c
          # Token-exactness alone would not have caught the config-driven heap
          # overflows this engine shipped with: they do not necessarily change
          # the output. The sanitizers are the half of this gate that watches
          # memory, and PILOT=1 puts concurrent expert loads against the cache
          # so the slot paths are exercised, not just walked past.
          #
          # This step asserts MEMORY SAFETY, not token-exactness -- the three
          # runs above already own that. -fsanitize changes inlining and
          # vectorization, so this is a differently-compiled binary, and float
          # reassociation can flip a token wherever the margin is thin. Demanding
          # exactness from it conflates two goals and made this job red on a
          # docs-only commit: the normal build matched 16/16, the sanitizer build
          # did not. So: run it, ignore a token mismatch, fail on any sanitizer
          # diagnostic.
          make clean >/dev/null 2>&1 || true
          make qwen36 EXTRA_CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          for fx in qwen36_tiny qwen38_2p4t_tiny; do
            ASAN_OPTIONS=detect_leaks=0:detect_stack_use_after_return=0 UBSAN_OPTIONS=print_stacktrace=1 \
              COLI_DENSE_I8=0 SNAP=${fx}_c PILOT=1 WIDE=2 \
              ./qwen36 1 8 $fx/ref_full.json > san.log 2>&1 || true
            if grep -qE "ERROR: AddressSanitizer|runtime error:" san.log; then
              echo "FAIL: sanitizer diagnostic under PILOT ($fx)"; cat san.log; exit 1
            fi
            echo "sanitizers clean ($fx):"; grep -E "Matching tokens" san.log || true
          done
          # Same sanitized binary on hostile weights: an all-NaN router row and an
          # oversized e_score_correction_bias must degrade or be refused, never
          # reach the heap.
          ASAN_OPTIONS=detect_leaks=0:detect_stack_use_after_return=0 QWEN36_TINY_C=qwen36_tiny_c \
            QWEN36_TINY_REF=qwen36_tiny/ref_full.json \
            python3 -m unittest -v tests.test_qwen36_hostile_weights
      - name: KV prefix reuse is token-identical (serve, several turns)
        run: |
          cd c
          # Reusing a previous turn's state must change the timing and nothing
          # else. A wrong reuse length does not crash: it answers from another
          # conversation's state and still reads plausibly, so this is the only
          # gate that would catch it. The sanitizer step above rebuilt the
          # engine, so rebuild the normal one first.
          make clean >/dev/null 2>&1 || true
          make qwen36
          QWEN36_TINY=qwen36_tiny_c python3 -m unittest -v tests.test_qwen36_prefix_serve
      - name: Expert kernel A/B on an int4 gs64 fixture (old path vs expert_ffn.h, byte-identical ids)
        run: |
          cd c
          make clean >/dev/null 2>&1 || true
          make qwen36
          # The int8 gate above never enters the shared kernel (it needs an int4
          # gs=64 container with widths that are multiples of 64: the default
          # tiny has inter=32). This fixture does. The reference is the same
          # torch model, but what this step asserts is not oracle agreement
          # (int4 experts drift from f32 by design): it is that the kernel and
          # the unpack-to-int8 path it replaces emit the SAME ids at every cap,
          # including cap=1 (one expert resident: the per-pair cut) and cap=16
          # (the whole prompt in one run). Within each path the last logits must
          # be the same bytes at every cap: an id survives a last-bit drift, and
          # the per-pair cut once rounded twice where an FMA build rounds once.
          python3 tools/make_qwen36_tiny.py --out qwen36_tiny64 --ref-mode full --inter 64 \
                  --emit-ref qwen36_tiny64/ref_full.json
          python3 tools/convert_qwen36.py --model qwen36_tiny64 --out qwen36_tiny64_c --ebits 4 --gs 64
          for cap in 1 2 8 16; do
            for k in 0 1; do
              QWEN_EXPERT_KERNEL=$k COLI_DENSE_I8=0 SNAP=qwen36_tiny64_c DUMP=logits_${cap}_$k.f32 \
                ./qwen36 "$cap" 4 qwen36_tiny64/ref_full.json > ab_${cap}_$k.log 2>&1 || true
              grep -E "^C engine" ab_${cap}_$k.log > ids_${cap}_$k.txt
            done
            grep -q "expert kernel: planar int4" ab_${cap}_1.log || { echo "FAIL: kernel did not engage at cap=$cap"; cat ab_${cap}_1.log; exit 1; }
            grep -q "expert kernel: planar int4" ab_${cap}_0.log && { echo "FAIL: QWEN_EXPERT_KERNEL=0 still engaged the kernel"; exit 1; }
            test -s ids_${cap}_1.txt || { echo "FAIL: no ids at cap=$cap"; cat ab_${cap}_1.log; exit 1; }
            cmp ids_${cap}_0.txt ids_${cap}_1.txt || { echo "FAIL: ids differ at cap=$cap"; cat ids_${cap}_0.txt ids_${cap}_1.txt; exit 1; }
            echo "cap=$cap: identical ($(cat ids_${cap}_1.txt))"
          done
          for k in 0 1; do
            for cap in 1 2 8; do
              test -s logits_${cap}_$k.f32 || { echo "FAIL: no logits dump at cap=$cap kernel=$k"; exit 1; }
              cmp logits_${cap}_$k.f32 logits_16_$k.f32 || { echo "FAIL: kernel=$k logits at cap=$cap differ from cap=16"; exit 1; }
            done
            echo "kernel=$k: identical logits at cap 1/2/8/16"
          done
          make tests/test_expert_ffn && ./tests/test_expert_ffn
      - name: Mixed expert layout (int4 gs64 gate/up, int8 down) loads and is cap-independent
        run: |
          cd c
          # The #1370 experiment knob: one slab per expert with int4 gate/up and int8
          # down (2*inter*hidden bytes). The engine must tell it apart from int4 and
          # int8 by size, read every matrix in its own format, and give the same ids
          # at every cache capacity (cap=1 recycles the single slot after each expert,
          # which is where a wrong slab offset would show). The ids are not compared to
          # the torch oracle: int4 gate/up drift from f32 by design, as in the A/B above.
          python3 tools/convert_qwen36.py --model qwen36_tiny64 --out qwen36_tiny64_d8 --ebits 4 --gs 64 --down-bits 8
          python3 - <<'PY'
          import json; m = json.load(open("qwen36_tiny64_d8/qwen36_meta.json"))
          assert m["expert_down_bits"] == 8 and m["expert_down_gs"] == 0 and m["expert_gs"] == 64, m
          PY
          for cap in 1 2 8; do
            COLI_DENSE_I8=0 SNAP=qwen36_tiny64_d8 ./qwen36 "$cap" 4 qwen36_tiny64/ref_full.json > mixed_$cap.log 2>&1 || true
            grep -q "expert format on disk: int4 gate/up + int8 down" mixed_$cap.log || { echo "FAIL: mixed layout not detected at cap=$cap"; cat mixed_$cap.log; exit 1; }
            grep -E "^C engine" mixed_$cap.log > mixed_ids_$cap.txt
            test -s mixed_ids_$cap.txt || { echo "FAIL: no ids at cap=$cap"; cat mixed_$cap.log; exit 1; }
          done
          cmp mixed_ids_1.txt mixed_ids_8.txt && cmp mixed_ids_2.txt mixed_ids_8.txt || { echo "FAIL: ids differ across caps"; cat mixed_ids_*.txt; exit 1; }
          echo "mixed layout: identical ids at cap 1/2/8 ($(cat mixed_ids_8.txt))"
          # COLI_CUDA=1 on a mixed container is refused with a line, the CPU path stands
          COLI_CUDA=1 COLI_DENSE_I8=0 SNAP=qwen36_tiny64_d8 ./qwen36 8 4 qwen36_tiny64/ref_full.json > mixed_cuda.log 2>&1 || true
          grep -q "COLI_CUDA=1 ignored: the VRAM expert tier does not take the mixed layout" mixed_cuda.log || { echo "FAIL: tier refusal line missing"; cat mixed_cuda.log; exit 1; }
      - name: Pinned experts and PILOT prefetch never change the logits (int4 gs64 fixture)
        run: |
          cd c
          # HOT and COLIBRI_RESIDENT pin experts, PILOT loads the next layers' from a
          # worker thread: they decide which experts stay in RAM, never what is
          # computed, so the last logits must be the bytes of cap=16 without them.
          # At a small cap they were not: a moe run read its experts from slots that
          # nothing marked busy, so the run's own next load (fewer unpinned slots than
          # topk) or the worker could reload one under the kernel. cap starts at 2 =
          # topk: this step is about eviction, the cap=1 cut is the A/B step's.
          B=./qwen36
          run() {  # tag kernel cap [VAR=value...]
            local tag=$1 k=$2 cap=$3; shift 3
            env "$@" QWEN_EXPERT_KERNEL=$k COLI_DENSE_I8=0 SNAP=qwen36_tiny64_c DUMP=pin_$tag.f32 \
              $B "$cap" 4 qwen36_tiny64/ref_full.json > pin_$tag.log 2>&1 || true
            test -s pin_$tag.f32 || { echo "FAIL: no logits dump ($tag)"; cat pin_$tag.log; exit 1; }
          }
          fail=0
          for k in 0 1; do
            run ref_$k $k 16
            for cap in 2 3 4; do
              for hot in 1 2 3; do
                run k${k}_cap${cap}_hot$hot $k $cap HOT=$hot
                grep -q "^\[HOT\] Pinned [1-9]" pin_k${k}_cap${cap}_hot$hot.log || { echo "FAIL: HOT pinned nothing"; exit 1; }
              done
              for r in 1 2; do
                run k${k}_cap${cap}_res$r $k $cap COLIBRI_RESIDENT=$r
                grep -q "^\[RESIDENT\] Pinned [1-9]" pin_k${k}_cap${cap}_res$r.log || { echo "FAIL: RESIDENT pinned nothing"; exit 1; }
              done
            done
            # PILOT races a loader thread against the moe run: repeat it
            for i in $(seq 10); do
              run k${k}_pilot1_$i $k 2 PILOT=1
              run k${k}_pilot3_$i $k 2 PILOT=3 WIDE=4
            done
            n=0 bad=0
            for f in pin_k${k}_*.f32; do
              n=$((n+1)); cmp -s "$f" pin_ref_$k.f32 || { echo "kernel=$k: ${f#pin_k${k}_} differs from cap=16"; bad=$((bad+1)); }
            done
            echo "kernel=$k: $((n-bad))/$n runs give the cap=16 logits"
            [ $bad -eq 0 ] || fail=1
          done
          exit $fail
      - name: A malformed container is refused, not read
        run: |
          cd c
          # The case ASan caught in review: config.json and qwen36_meta.json ship
          # in the same container and disagreed on the layer count, so is_attn was
          # sized from one and written from the other. Reproduced without the
          # guard as a heap-buffer-overflow WRITE at load_meta; with it the engine
          # refuses. A well-formed fixture cannot cover this, which is why it gets
          # its own step -- and it asserts the REFUSAL, so a guard that silently
          # stops guarding fails here.
          cp -r qwen36_tiny_c qwen36_tiny_bad
          python3 - <<'PY'
          import json
          p = "qwen36_tiny_bad/config.json"
          cfg = json.load(open(p))
          cfg["num_hidden_layers"] = 4          # meta says 8
          json.dump(cfg, open(p, "w"))
          PY
          if COLI_DENSE_I8=0 SNAP=qwen36_tiny_bad ./qwen36 8 8 \
               qwen36_tiny/ref_full.json > bad.log 2>&1; then
            echo "FAIL: engine accepted a container whose two config files disagree"
            cat bad.log; exit 1
          fi
          grep -q "config.json says 4 layers" bad.log || {
            echo "FAIL: refused, but not for the reason under test"; cat bad.log; exit 1; }
          echo "refused as expected:"; grep '^\[cfg\]' bad.log
      - name: Brain and Profile reach the dashboard
        run: |
          cd c
          # The oracle fixture has no tokenizer (weights only); `coli serve`
          # needs one to encode the prompt. The byte tokenizer is test data
          # sized to the fixture's vocab, the same as the GLM-5.3 gate uses.
          python3 tools/make_edge_tiny_tokenizer.py --vocab-size 320 qwen36_tiny_c
          make qwen36 >/dev/null
          COLI_QWEN36_FIXTURE=qwen36_tiny_c python3 -m unittest -v tests.test_qwen36_dashboard
      - name: "The expert format probe reads int8 as int8 and int4 as int4 (#1331)"
        run: |
          cd c
          # #1331 was the CUDA tier receiving fmt=4 for an int8 container: budget
          # reserved, zero promotions. The probe is decided from the on-disk
          # size of the first expert and printed once; pin it on both formats
          # without a GPU. The int4 run is not held to token-exactness here.
          SNAP=qwen36_tiny_c ./qwen36 1 8 qwen36_tiny/ref_full.json 2> probe8.log >/dev/null || true
          grep -q 'expert format on disk: int8' probe8.log || { echo "FAIL: int8 container probed as"; grep 'expert format' probe8.log; exit 1; }
          python3 tools/convert_qwen36.py --model qwen36_tiny --out qwen36_tiny_c4 --ebits 4 >/dev/null
          SNAP=qwen36_tiny_c4 ./qwen36 1 4 qwen36_tiny/ref_full.json 2> probe4.log >/dev/null || true
          grep -q 'expert format on disk: int4' probe4.log || { echo "FAIL: int4 container probed as"; grep 'expert format' probe4.log; exit 1; }
          echo "probe: int8 -> fmt=1, int4 -> fmt=4"

  olmoe-tiny-check:
    name: OLMoE tiny oracle (token-exact + dashboard HITS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: c/tools/oracle-requirements.txt
      - name: Install torch (CPU) + transformers
        run: pip install -r c/tools/oracle-requirements.txt
      - name: Tiny OLMoE checkpoint, converted
        run: |
          cd c
          # 4 layers x 8 experts at toy dimensions, greedy reference from the
          # HF model in ref_olmoe.json. The converter is the real one.
          python3 tools/make_olmoe_tiny.py --output olmoe_tiny
          python3 tools/convert_olmoe_merged.py --model olmoe_tiny --out olmoe_tiny_c
          # weights only: serve mode needs a tokenizer to encode the prompt
          python3 tools/make_edge_tiny_tokenizer.py --vocab-size 128 olmoe_tiny_c
      - name: Token-exact against the reference
        run: |
          cd c
          make olmoe
          SNAP=olmoe_tiny_c ./olmoe 8 8 olmoe_tiny/ref_olmoe.json | tee oracle.log
          # the engine prints the score and exits 0 either way: the gate is here
          grep -qE 'Matching tokens: ([0-9]+)/\1$' oracle.log
      - name: "Cache cap: the sentinel takes the budget, an explicit cap is left alone"
        run: |
          cd c
          # The cap used to be a constant 8 slots per layer whenever nobody
          # chose one (#1443). It is now derived from the RAM budget, and the
          # derivation needs a real container to size: this is the job that has
          # one.
          COLI_OLMOE_FIXTURE=olmoe_tiny_c python3 -m unittest -v tests.test_olmoe_cap_budget
      - name: "Brain tab: HITS after every turn, on the grid EMAP declared"
        run: |
          cd c
          OLMOE_TINY=olmoe_tiny_c python3 -m unittest -v tests.test_olmoe_dashboard_hits
      - name: "Over-long prompt: CONTEXT_EXCEEDED, so the gateway answers 400"
        run: |
          cd c
          COLI_OLMOE_FIXTURE=olmoe_tiny_c python3 -m unittest -v tests.test_olmoe_context_exceeded
      - name: KV prefix reuse is token-identical (serve, several turns)
        run: |
          cd c
          # Same contract as the Qwen3.6 job runs, from the same harness: a
          # reused prefix must produce exactly what a cold engine produces for
          # the same prompt. Wrong reuse is silent, so the gate is the only
          # thing between it and a user.
          OLMOE_TINY=olmoe_tiny_c python3 -m unittest -v tests.test_olmoe_prefix_serve
      - name: "Brio over serve: snapshot scoring is exact, and invisible to chat"
        run: |
          cd c
          # Closed-set scoring must give the log probabilities a cold recompute
          # gives, and a request without the keys must stay byte-identical.
          # Both are silent when wrong; this module was skipping everywhere
          # until it was named here (#1742).
          OLMOE_TINY=olmoe_tiny_c python3 -m unittest -v tests.test_brio_serve

  dsv41-tiny-check:
    name: DeepSeek V4.1 tiny oracle (engram + DSA + fp4 experts + vision)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: c/tools/oracle-requirements.txt
      - name: Install torch (CPU) + sympy + Pillow
        run: |
          pip install -r c/tools/oracle-requirements.txt
          pip install sympy pillow
      - name: Tiny V4.1-shaped container and its reference
        run: |
          cd c
          # The same tensor names, dtypes and block-scale conventions as the released
          # checkpoint at toy dimensions, so the engine reads the real format: fp8 dense
          # with 32x32 ue8m0 tiles, fp4 experts with per-32 group scales, an fp8 engram
          # table read row by row, and a vision tower.
          python3 tools/make_dsv41_tiny.py --out dsv41_tiny --emit-ref dsv41_tiny/ref.json
      - name: Token-exact against the reference, at several cache capacities
        run: |
          cd c
          make deepseek_v41
          # cap=1 evicts on every routed expert, which is where slot bookkeeping breaks;
          # cap=8 never would. The engine exits non-zero on any token mismatch, and on a
          # vision tower that drifts from its reference rows.
          for cap in 1 2 8; do
            echo "::group::cap=$cap"
            SNAP=dsv41_tiny ./deepseek_v41 "$cap" dsv41_tiny/ref.json
            echo "::endgroup::"
          done
      - name: "Multi-SSD mirror and O_DIRECT change nothing about the answer"
        run: |
          cd c
          # A replica answers the same bytes: the same container in a second directory
          # must produce the same token stream, on the primary and through the mirror,
          # with the O_DIRECT window and with the buffered path it replaces. Routing an
          # expert to a drive is an I/O decision and must not be visible downstream.
          mkdir -p dsv41_mirror
          cp dsv41_tiny/model.safetensors dsv41_mirror/
          SNAP=dsv41_tiny ./deepseek_v41 8 dsv41_tiny/ref.json > primary.txt 2>/dev/null
          SNAP=dsv41_tiny COLI_MODEL_MIRROR=dsv41_mirror ./deepseek_v41 8 dsv41_tiny/ref.json > mirror.txt 2>/dev/null
          SNAP=dsv41_tiny COLI_MODEL_MIRROR=dsv41_mirror V41_DIRECT=0 ./deepseek_v41 8 dsv41_tiny/ref.json > buffered.txt 2>/dev/null
          cmp primary.txt mirror.txt
          cmp primary.txt buffered.txt
          # COLI_MODEL_DIRS splits the container as DISTINCT shards -- no second copy,
          # which is the only multi-drive layout most people can build out of a 510 GB
          # checkpoint. The shards move; the answer must not.
          mkdir -p dsv41_split_meta dsv41_split_shard
          cp dsv41_tiny/config.json dsv41_tiny/tokenizer.json dsv41_tiny/dsv41_engram.json dsv41_split_meta/
          cp dsv41_tiny/model.safetensors dsv41_split_shard/
          SNAP=dsv41_split_meta COLI_MODEL_DIRS=dsv41_split_shard ./deepseek_v41 8 dsv41_tiny/ref.json > split.txt 2>split.err
          cmp primary.txt split.txt
          grep -q "\[SPLIT\] model across 2 dir(s)" split.err
          # A copy that is not byte-identical is not a replica: it is refused, and the
          # run stays on the primary rather than reading someone else's offsets.
          mkdir -p dsv41_divergent
          python3 - <<'PY'
          import pathlib
          src = pathlib.Path("dsv41_tiny/model.safetensors")
          data = bytearray(src.read_bytes())
          data[8] ^= 0x01        # inside the safetensors header
          pathlib.Path("dsv41_divergent/model.safetensors").write_bytes(bytes(data))
          PY
          SNAP=dsv41_tiny COLI_MODEL_MIRROR=dsv41_divergent ./deepseek_v41 8 dsv41_tiny/ref.json > divergent.txt 2>divergent.err
          cmp primary.txt divergent.txt
          grep -q "header differs from the primary copy" divergent.err
      - name: KV prefix reuse (opt-in here) and the resumed-prefill exactness
        run: |
          cd c
          # Two gates in one file. The first is exactness and is ours: a prefill
          # that resumes mid-sequence must compute what a cold prefill computes,
          # which is what the index-key schedule fix is for. The second is the
          # shared contract, minus the one scenario this engine cannot satisfy --
          # a prefix holding generated positions, which attend differently from
          # prefilled ones by the vendor's own design. The override says so.
          DSV41_TINY=dsv41_tiny python3 -m unittest -v tests.test_dsv41_prefix_serve
      - name: "A prompt longer than one block, so the block boundary is crossed"
        run: |
          cd c
          # Attention projects a block of positions at a time and the MoE routes one,
          # both capped at 32. The default fixture's prompt is eight tokens and never
          # reaches that cap, so a forty-token one is built as well: it crosses the
          # boundary in both, and has to stay token-exact anyway.
          python3 tools/make_dsv41_tiny.py --out dsv41_long --emit-ref dsv41_long/ref.json \
            --prompt-len 40 --max-new 6
          for cap in 2 8; do
            echo "::group::long prompt, cap=$cap"
            SNAP=dsv41_long ./deepseek_v41 "$cap" dsv41_long/ref.json
            echo "::endgroup::"
          done
      - name: The published index cache is the vendor's, not the tidy one
        run: |
          cd c
          # model.py republishes shared_attn.index_k only when a layer completes a
          # compression group, so a decode step with an incomplete group scores against
          # whichever cache was published last. That is the released behaviour and every
          # number for this model was produced with it; V41_INDEX_OWNER=1 is the reading
          # the architecture implies, and it is a DIFFERENT model. Assert they differ, so
          # nobody "fixes" the default by accident.
          if SNAP=dsv41_tiny V41_INDEX_OWNER=1 ./deepseek_v41 8 dsv41_tiny/ref.json > /dev/null 2>&1; then
            echo "FAIL: V41_INDEX_OWNER=1 reproduced the vendor's tokens; one of the two"
            echo "      paths is not doing what its comment says"
            exit 1
          fi
          echo "the two index-key policies differ, as documented"
      - name: "DSpark: a verified draft is the token sequential decode would have given"
        run: |
          cd c
          # The fixture's draft head is random, so nothing it proposes would ever be
          # accepted and the verification path would never run. V41_SPEC_FORCE drafts
          # the reference's own tokens instead: 1 accepts the whole block, 2 corrupts
          # the last draft so a round is rejected part way and the rollback runs, 3
          # keeps the head's drafts, which is what serving does, 4 rejects the first
          # draft of every round (all drafted rows rolled back, what serving at 10-30%
          # acceptance does most of the time) and 5 a different one each round. All
          # of them have to reproduce the reference token for token, at any cache
          # capacity.
          for force in 1 2 3 4 5; do
            for cap in 1 8; do
              echo "::group::V41_SPEC_FORCE=$force cap=$cap"
              SNAP=dsv41_tiny V41_DSPARK=1 V41_SPEC_FORCE=$force ./deepseek_v41 "$cap" dsv41_tiny/ref.json
              echo "::endgroup::"
            done
          done
          # and with only part of the block verified, which is a different rollback
          SNAP=dsv41_tiny V41_DSPARK=1 V41_SPEC_FORCE=2 V41_DSPARK_MAX=1 ./deepseek_v41 8 dsv41_tiny/ref.json
      - name: "Brain tab: EMAP after READY and STAT, HITS after every turn"
        run: |
          cd c
          COLI_DSV41_FIXTURE=dsv41_tiny python3 -m unittest -v tests.test_dsv41_dashboard
      - name: "Serving: an image changes the answer, a draft does not"
        run: |
          cd c
          COLI_DSV41_FIXTURE=dsv41_tiny python3 -m unittest -v \
            tests.test_dsv41_image_serve tests.test_dsv41_dspark_serve
      - name: "Tool calling: the checkpoint's own encoding cases, byte for byte"
        run: |
          cd c
          # no engine and no fixture here: the mock speaks the SERVE protocol, and the
          # vendor's encoding cases are checked into tests/fixtures
          python3 -m unittest -v tests.test_openai_tools_v41_e2e

  qwen38-tiny-check:
    name: Qwen3.8 tiny oracle (GDN + QSA + PLE + MoE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: c/tools/requirements-qwen38-tiny.txt
      - name: Install pinned Qwen4-Exp oracle dependencies
        run: pip install -r c/tools/requirements-qwen38-tiny.txt
      - name: Generate the upstream text fixture and run the token-and-logit oracle
        run: make -C c qwen38-tiny-check
      - name: Routed experts as the release ships them (FP8 shards), then the engine on the fake CUDA tier
        run: make -C c qwen38-tiny-fp8-check qwen38-tier-engine-check
      - name: Routed experts as int4-g64 from the converter's sidecar
        run: make -C c qwen38-tiny-int4-check
      - name: MTP speculative decoding against plain decoding (lossless gate)
        run: make -C c qwen38-tiny-mtp-check
      - name: Repeat the eviction path under ASan and UBSan
        run: |
          cd c
          make -B qwen38 EXTRA_CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          ASAN_OPTIONS=detect_leaks=0:detect_stack_use_after_return=0 UBSAN_OPTIONS=print_stacktrace=1 \
            OMP_NUM_THREADS=2 SNAP=./qwen38_tiny \
            ./qwen38 1 8 ./qwen38_tiny/ref.json > qwen38-san.log 2>&1
          # the int4-g64 sidecar's load and matmul, evicting at cap 1
          ASAN_OPTIONS=detect_leaks=0:detect_stack_use_after_return=0 UBSAN_OPTIONS=print_stacktrace=1 \
            Q38_EXPERT_INT4=1 OMP_NUM_THREADS=2 SNAP=./qwen38_tiny_int4 \
            ./qwen38 1 8 ./qwen38_tiny_int4/ref_int4.json > qwen38-san-int4.log 2>&1
          if grep -qE "ERROR: AddressSanitizer|runtime error:" qwen38-san.log qwen38-san-int4.log; then
            cat qwen38-san.log qwen38-san-int4.log
            exit 1
          fi
          grep -q "Matching tokens: 8/8" qwen38-san.log
          grep -q "Matching tokens: 8/8" qwen38-san-int4.log
          # the MTP head, the S=2 verify and the rollback on every fixture kind
          ASAN_OPTIONS=detect_leaks=0:detect_stack_use_after_return=0 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            python3 tests/qwen38_mtp_harness.py --engine ./qwen38 --bf16 ./qwen38_tiny_mtp \
            --fp8 ./qwen38_tiny_fp8_mtp --int4 ./qwen38_tiny_int4_mtp
      - name: Refuse config and tensor-shape disagreement
        run: |
          cd c
          cp -r qwen38_tiny qwen38_tiny_bad
          python3 - <<'PY'
          import json
          path = "qwen38_tiny_bad/config.json"
          config = json.load(open(path, encoding="utf-8"))
          config["hc_count"] = 5
          json.dump(config, open(path, "w", encoding="utf-8"))
          PY
          if SNAP=./qwen38_tiny_bad ./qwen38 1 8 ./qwen38_tiny/ref.json > qwen38-bad.log 2>&1; then
            echo "FAIL: malformed Qwen3.8 container was accepted"
            cat qwen38-bad.log
            exit 1
          fi
          grep -qE "elements, expected|gated residual dimensions" qwen38-bad.log
      - name: "Brain tab: EMAP after READY and STAT, HITS after every turn"
        run: |
          cd c
          # the oracle fixture has no tokenizer; serve mode needs one
          python3 tools/make_edge_tiny_tokenizer.py --vocab-size "$(python3 -c 'import json;print(json.load(open("qwen38_tiny/config.json"))["vocab_size"])')" qwen38_tiny
          make qwen38 >/dev/null
          QWEN38_TINY=qwen38_tiny python3 -m unittest -v tests.test_qwen38_dashboard tests.test_qwen38_brio
          python3 tools/make_edge_tiny_tokenizer.py --vocab-size 64 qwen38_tiny_fp8
          QWEN38_TINY=qwen38_tiny_fp8 python3 -m unittest -v tests.test_qwen38_brio

