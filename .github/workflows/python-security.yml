name: Python security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install --disable-pip-version-check bandit==1.7.10

      # Skips: B101 (assert) is expected in tests; B404/B603 (subprocess) always
      # pass an argv list here; B310 (urlopen) always calls hard-coded https URLs
      # against huggingface.co; B311 (random.Random) is used only to shuffle
      # benchmark documents; B112 (try/except/continue) is intentional dataset
      # skipping in tools/fetch_benchmarks.py. Severity gate is medium so low
      # noise findings don't churn PRs.
      - name: Run Bandit
        run: |
          bandit \
            --recursive \
            --severity-level medium \
            --confidence-level medium \
            --skip B101,B310,B311,B404,B603,B112 \
            c/
