name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The default path: portable CPU build, dependency-free C and Python tests.
  cpu-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make check (portable build + C/Python tests)
        run: make -C c check

  # Compile-only validation of the shared GPU backend under nvcc.
  # Runners have no GPU, so kernels are built for a fixed arch and not executed;
  # runtime correctness is covered by `make cuda-test` on GPU hardware
  # (documented in GPU_BACKENDS.md).
  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: apt-get update && apt-get install -y --no-install-recommends make gcc g++
      - name: compile backend + test binary + engine (nvcc)
        run: |
          make -C c gpu-compile CUDA_ARCH=sm_80
          make -C c glm CUDA=1 CUDA_ARCH=sm_80

  # Compile-only validation of the SAME backend source under hipcc (ROCm).
  # Not `container:`-based: the runner must free disk BEFORE pulling (recent
  # rocm/dev images exceed the hosted runner's free space), and the tag is
  # pinned — `latest` grew past the disk limit once already.
  hip-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: compile backend + test binary + engine (hipcc)
        run: |
          docker run --rm -v "$PWD":/src -w /src rocm/dev-ubuntu-24.04:6.2 bash -c '
            apt-get update && apt-get install -y --no-install-recommends make gcc g++ &&
            make -C c gpu-compile HIP=1 HIP_ARCH=gfx1100 &&
            make -C c glm HIP=1 HIP_ARCH=gfx1100'
