name: CUDA container

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  cuda-container:
    name: Build CUDA 12.4 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build the CUDA image
        run: docker build -t "$IMAGE:2.1.0-cuda-12.4" -f docker/Dockerfile.cuda .
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push the CUDA image
        if: github.event_name == 'push'
        run: docker push "$IMAGE:2.1.0-cuda-12.4"
